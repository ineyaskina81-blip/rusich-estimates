<script>
'use strict';

const priceCatalog = (() => {
  const storageKey = 'rusich-price-catalog-v1';
  const xmlDecoder = new TextDecoder();
  const one = (node, name) => node.getElementsByTagNameNS('*', name)[0];
  const all = (node, name) => [...node.getElementsByTagNameNS('*', name)];
  const clean = value => String(value ?? '').trim();

  function xml(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (one(doc, 'parsererror')) throw new Error('Не удалось прочитать содержимое книги Excel.');
    return doc;
  }

  // Use the ZIP central directory so archives with deferred local sizes also work.
  function archive(buffer) {
    const view = new DataView(buffer);
    let end = buffer.byteLength - 22;
    const limit = Math.max(0, end - 65535);
    while (end >= limit && (view.getUint32(end, true) !== 0x06054b50 ||
      end + 22 + view.getUint16(end + 20, true) !== buffer.byteLength)) end--;
    if (end < limit) throw new Error('Выберите книгу Excel в формате .xlsx.');
    let offset = view.getUint32(end + 16, true);
    const count = view.getUint16(end + 10, true);
    const entries = new Map();
    for (let i = 0; i < count; i++) {
      if (view.getUint32(offset, true) !== 0x02014b50) throw new Error('Повреждённая книга Excel.');
      const nameLength = view.getUint16(offset + 28, true);
      const name = xmlDecoder.decode(new Uint8Array(buffer, offset + 46, nameLength));
      entries.set(name, {
        method: view.getUint16(offset + 10, true),
        size: view.getUint32(offset + 20, true),
        expandedSize: view.getUint32(offset + 24, true),
        local: view.getUint32(offset + 42, true)
      });
      offset += 46 + nameLength + view.getUint16(offset + 30, true) + view.getUint16(offset + 32, true);
    }
    return async name => {
      const entry = entries.get(name);
      if (!entry) return null;
      const { local, method, size, expandedSize } = entry;
      if (expandedSize > 30_000_000 || view.getUint32(local, true) !== 0x04034b50) {
        throw new Error('Не удалось открыть лист Excel.');
      }
      const start = local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true);
      const bytes = new Uint8Array(buffer, start, size);
      if (method === 0) return xmlDecoder.decode(bytes);
      if (method !== 8) throw new Error('Формат сжатия книги Excel не поддерживается.');
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Response(stream).text();
    };
  }

  function records(sheet, strings, expectedHeader) {
    const rows = all(sheet, 'row').map(row => {
      const cells = {};
      for (const cell of row.children) {
        const column = cell.getAttribute('r').match(/^[A-Z]+/)?.[0];
        const type = cell.getAttribute('t');
        const value = one(cell, 'v')?.textContent ?? '';
        if (type === 's') cells[column] = strings[Number(value)] ?? '';
        else if (type === 'inlineStr') cells[column] = all(cell, 't').map(t => t.textContent).join('');
        else if ((!type || type === 'n') && value !== '') cells[column] = Number(value);
        else if (type !== 'e') cells[column] = value;
      }
      return cells;
    });
    const headerIndex = rows.findIndex(row => row.A === expectedHeader);
    if (headerIndex < 0) throw new Error('В книге отсутствуют заголовки справочника.');
    const headers = Object.entries(rows[headerIndex]);
    return rows.slice(headerIndex + 1).map(row =>
      Object.fromEntries(headers.map(([column, header]) => [header, row[column]])));
  }

  async function read(file) {
    if (file.size > 20_000_000) throw new Error('Размер справочника превышает 20 МБ.');
    const part = archive(await file.arrayBuffer());
    const bookText = await part('xl/workbook.xml');
    const linksText = await part('xl/_rels/workbook.xml.rels');
    if (!bookText || !linksText) throw new Error('Выберите книгу Excel в формате .xlsx.');
    const book = xml(bookText);
    const links = new Map(all(xml(linksText), 'Relationship').map(link => [
      link.getAttribute('Id'), link.getAttribute('Target')
    ]));
    const sheets = new Map(all(book, 'sheet').map(sheet => [
      sheet.getAttribute('name'), links.get(sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id'))
    ]));
    const sharedText = await part('xl/sharedStrings.xml');
    const strings = sharedText
      ? all(xml(sharedText), 'si').map(item => all(item, 't').map(t => t.textContent).join(''))
      : [];
    async function sheet(name, header) {
      const target = sheets.get(name);
      if (!target) throw new Error('В книге отсутствует лист «' + name + '».');
      const text = await part(new URL(target, 'https://xlsx.invalid/xl/').pathname.slice(1));
      if (!text) throw new Error('Не удалось прочитать лист «' + name + '».');
      return records(xml(text), strings, header);
    }

    const positions = (await sheet('Позиции', 'Код позиции')).map(row => ({
      code: clean(row['Код позиции']), category: clean(row['Категория']),
      name: clean(row['Наименование']), unit: clean(row['Ед. изм.']), prices: []
    })).filter(item => item.code && item.category && item.name && item.unit);
    if (!positions.length) throw new Error('В справочнике нет позиций.');
    const byCode = new Map(positions.map(item => [item.code, item]));
    const uses1904 = ['1', 'true'].includes(one(book, 'workbookPr')?.getAttribute('date1904'));
    const epoch = uses1904 ? Date.UTC(1904, 0, 1) : Date.UTC(1899, 11, 30);
    const iso = value => {
      if (typeof value === 'number' && value > 0 && value < 2_958_000) {
        return new Date(epoch + Math.floor(value) * 86400000).toISOString().slice(0, 10);
      }
      const s = clean(value);
      return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : '';
    };
    function add(code, row, kind, value, date, expires = '', confirmed = '') {
      const position = byCode.get(clean(code));
      const priceCode = clean(row['Код цены']);
      if (!position || !priceCode || typeof value !== 'number' || value < 0.01 || value > 100000000) return;
      const unit = clean(row['Ед. изм.']);
      if (unit && unit !== position.unit) return;
      if (position.prices.some(price => price.code === priceCode)) return;
      position.prices.push({
        code: priceCode, kind, value, date, expires, confirmed,
        vat: clean(row['Режим НДС']) || 'НДС по источнику',
        source: clean(row['Файл сметы'] || row['Источник цены (ссылка или №)'] || row['Счёт №']),
        counterparty: clean(row['Поставщик'] || row['Заказчик или объект'])
      });
    }
    for (const row of await sheet('История', 'Код цены')) {
      add(row['Код позиции'], row, 'history', row['Цена, руб.'], iso(row['Дата по источнику']));
    }
    for (const [name, kind, counterparty] of [
      ['Закупка ОМТС', 'supply', 'Поставщик'], ['Для заказчика', 'customer', 'Заказчик или объект']
    ]) {
      for (const row of await sheet(name, 'Код цены')) {
        const date = iso(row['Дата цены']);
        const expires = iso(row['Действует по']);
        const confirmed = iso(row['Дата подтверждения']);
        const status = clean(row['Статус записи']);
        if (status && status !== 'Подтверждена') continue;
        if (!date || !confirmed || !clean(row[counterparty]) ||
          !clean(row['Источник цены (ссылка или №)']) || !clean(row['Подтвердил']) ||
          !['Без НДС', 'С НДС'].includes(row['Режим НДС']) ||
          (row['Действует по'] && (!expires || expires < date))) continue;
        add(row['Код позиции'], row, kind, row['Цена, руб.'], date, expires, confirmed);
      }
    }
    if (sheets.has('Счета ОМТС')) {
      for (const row of await sheet('Счета ОМТС', 'Код цены')) {
        if (row['Статус'] !== 'В справочнике' || row['Решение'] !== 'Подтвердить') continue;
        const confirmed = iso(row['Дата проверки']);
        const date = iso(row['Дата счёта']);
        if (!date || !confirmed) continue;
        add(row['Подтверждённый код'], {
          ...row, 'Ед. изм.': row['Единица для сравнения'], 'Режим НДС': row['Режим НДС цены']
        }, 'supply', row['Цена за ед., руб.'], date, iso(row['Действует по']), confirmed);
      }
    }
    return { name: file.name, positions };
  }

  function load() {
    try {
      return JSON.parse(localStorage.getItem(storageKey));
    } catch {
      return null;
    }
  }

  function save(data) {
    try {
      localStorage.setItem(storageKey, JSON.stringify(data));
      return true;
    } catch {
      return false;
    }
  }

  return { read, load, save };
})();
</script>
<script>
'use strict';

const categories = ['Работы', 'Материалы', 'Механизмы', 'Доставка', 'Прочее'];
let catalog = priceCatalog.load();
const steps = [
  { role: 'ПТО', missing: 'Позиция и объём' },
  { role: 'Главный инженер', missing: 'Проверка объёма техники', action: 'Подтвердить объём' },
  { role: 'ОМТС', missing: 'Проверка цены техники', action: 'Подтвердить цену ОМТС' },

function nextEstimateNumber(date) {
  const prefix = String(date.getFullYear()).slice(-2) + '-';
  const lastNumber = estimates.reduce((highest, estimate) => {
    if (!estimate.id.startsWith(prefix)) return highest;
    return Math.max(highest, Number(estimate.id.slice(prefix.length)) || 0);
  }, 0);
  return prefix + String(lastNumber + 1).padStart(3, '0');
}

function nextStep(row) {

    if (!row.volumeChecked || row.hours == null) return 1;
  }
  return 3;
}

function lineAmountCents(volume, unitPrice) {

}

}

function sectionLabel(estimate, key) {
  if (!key) return '';

  const section = estimate.sections?.find(item => item.id === sectionId);
  if (!section) return '';
  const child = section.children.find(item => item.id === subsectionId);
  return child ? section.name + ' → ' + child.name : section.name;
}

function sectionGroups(estimate) {
  const groups = new Map();
  for (const section of estimate.sections ?? []) {
    groups.set(section.id, { name: section.name, parent: '', rows: [] });
    for (const child of section.children) {
      groups.set(section.id + '/' + child.id, { name: child.name, parent: section.id, rows: [] });
    }
  }
  const unassigned = { name: 'Без раздела', parent: '', rows: [] };
  for (const row of estimate.rows) (groups.get(row.structure) ?? unassigned).rows.push(row);
  if (unassigned.rows.length) groups.set('', unassigned);
  return groups;
}

  const target = childId ? section?.children.find(item => item.id === childId) : section;
  if (!target) return;
  const belongs = value => value === key || (!childId && value?.startsWith(key + '/'));
  const affected = estimate.rows.filter(row => belongs(row.structure));
  const destination = childId ? sectionId : '';
  const kind = childId ? 'подраздел' : 'раздел';
  const consequence = affected.length ? '\nРасценки будут перенесены ' +
    (childId ? 'в раздел «' + section.name + '».' : 'в группу «Без раздела».') : '';
  const childrenNote = !childId && section.children.length ? ' Вместе с подразделами.' : '';
  if (!window.confirm('Удалить ' + kind + ' «' + target.name + '»?' + childrenNote + consequence)) return;
  for (const row of affected) row.structure = destination;
  if (childId) section.children = section.children.filter(item => item.id !== childId);
  else estimate.sections = estimate.sections.filter(item => item.id !== sectionId);
  if (belongs(sectionFilter)) sectionFilter = destination;
  if (belongs(entryStructure)) entryStructure = destination;
  const entry = document.querySelector('#inline-position-content');

}

    cardFilters.category = button.dataset.category;
    draw();
    [...document.querySelectorAll('[data-category]')].find(tab => tab.dataset.category === cardFilters.category).focus();
  };
  document.querySelector('#query').oninput = event => { cardFilters.query = event.target.value; draw(); };
  document.querySelector('#role').onchange = event => { cardFilters.role = event.target.value; draw(); };
  if (estimate.sections?.length) {
    document.querySelector('#section-filter').onchange = event => { sectionFilter = event.target.value; draw(); };
  }
  document.querySelector('#clear').onclick = () => {
    sectionFilter = '';
    cardFilters = { query: '', category: 'all', role: 'all' };
    renderCard();
    document.querySelector('#query').focus();
  };
  const advanceButton = document.querySelector('#advance-estimate');
  if (advanceButton) advanceButton.onclick = () => advanceEstimate(estimate);
  const addSectionButton = document.querySelector('#add-estimate-section');
  if (addSectionButton) addSectionButton.onclick = () => showSectionForm();
  const addSubsectionButton = document.querySelector('#add-estimate-subsection');
  if (addSubsectionButton) addSubsectionButton.onclick = () =>
    showSectionForm((entryStructure || sectionFilter).split('/')[0] || estimate.sections[0].id);
  document.querySelector('#results').onclick = event => {
    const button = event.target.closest('button');
    if (!button) return;
    const { childSection, entrySection, deleteSection, editLine, deleteLine, row } = button.dataset;
    if (childSection) showSectionForm(childSection);
    else if (deleteSection) deleteEstimateSection(deleteSection);
    else if (entrySection) {
      if (editingLine) {
        editingLine = null;
        renderInlineEntry();
      }
      setEntryStructure(entrySection);
    }
    else if (editLine) {
      editingLine = estimate.rows.find(item => item.id === editLine);
      renderInlineEntry();
      focusInlineEntry();
    } else if (deleteLine) deleteEstimateLine(estimate.rows.find(item => item.id === deleteLine));
    else if (row) openDrawer(estimate.rows.find(item => item.id === row));
  };
  draw();
  if (stage !== 0) return;
  const entry = document.querySelector('#inline-position-content');
  if (!resetEntry && previousEntry?.dataset.estimateId === estimate.id) {
    entry.replaceWith(previousEntry);
    const structure = previousEntry.querySelector('#inline-structure');
    const selected = structure.querySelector('select')?.value;
    structure.innerHTML = estimate.sections?.length ? structureField(selected ?? entryStructure) : '';
  } else {
    renderInlineEntry();
  }
}

function setEntryStructure(key, focus = true) {
  entryStructure = key;
  const entry = document.querySelector('#inline-position-content');
  const target = entry?.querySelector('[name="structure"]');
  if (target && !editingLine) target.value = key;
  const label = entry?.querySelector('#entry-target');
  if (label) label.textContent = sectionLabel(activeEstimate, editingLine?.structure ?? key);
  if (focus) focusInlineEntry();
}

function renderInlineEntry() {
  const entry = document.querySelector('#inline-position-content');
  if (!entry || !activeEstimate || estimateStage(activeEstimate) !== 0) return;
  entry.dataset.estimateId = activeEstimate.id;
  entry.innerHTML = stepForm(0, editingLine);
  bindPositionForm(entry, 0, editingLine);
  setEntryStructure(entryStructure, false);
  entry.onchange = event => {
    if (event.target.name !== 'structure') return;
    const key = event.target.value;
    if (!editingLine) entryStructure = key;
    const label = entry.querySelector('#entry-target');
    if (label) label.textContent = sectionLabel(activeEstimate, key);
  };
  const cancel = entry.querySelector('#cancel-line-edit');
  if (cancel) cancel.onclick = () => {
    editingLine = null;
    renderInlineEntry();
    focusInlineEntry();
  };
}

function focusInlineEntry() {
  const entry = document.querySelector('#inline-position-content');
  (entry?.querySelector('#catalog-query') || entry?.querySelector('[name="name"]'))?.focus();
}

const priceKinds = { history: 'История', supply: 'Закупка ОМТС', customer: 'Для заказчика' };
const previewPriceKinds = { ...priceKinds, history: 'Историческая цена' };
const baseCatalogPrice = row => row?.basePrice ?? row?.baseWorkPrice;
const hourlyUnit = unit => ['ч', 'маш.-ч'].includes(unit);

function availablePrices(row, index) {
  const position = catalog?.positions.find(item => item.code === row?.catalogCode && item.unit === row.unit);
  return pricesForPosition(position, index);
}

function pricesForPosition(position, index) {
  const date = new Date().toLocaleDateString('sv-SE');
  return (position?.prices ?? []).filter(price => {
    if (index === 2 ? price.kind !== 'supply' : price.kind === 'supply') return false;
    return price.kind === 'history' ||
      price.date <= date && price.confirmed <= date && (!price.expires || price.expires >= date);
  }).sort((a, b) => Number(a.kind === 'history') - Number(b.kind === 'history') || b.date.localeCompare(a.date));
}

function priceOrigin(price) {
  return [priceKinds[price.kind], price.code, price.date, price.vat, price.counterparty, price.source]
    .filter(Boolean).join(' · ');
}

function priceOption(price) {
  return [money(price.value), previewPriceKinds[price.kind], price.date, price.vat, price.code].filter(Boolean).join(' · ');
}

function positionPriceLabel(position) {
  const purchase = position.category === 'Механизмы' ? pricesForPosition(position, 2)[0] : null;
  const price = purchase ?? pricesForPosition(position, 3)[0];
  return price ? money(price.value) + '/' + position.unit + ' · ' + previewPriceKinds[price.kind] : 'Цена отсутствует';
}

function pricePicker(prices) {
  if (!prices.length) return '';
  return '<fieldset class="catalog-fields"><legend>Цена из справочника</legend><div class="fields">' +
    '<label>Расценка<select id="catalog-price"><option value="">Выберите цену</option>' +
    prices.map((price, index) => '<option value="' + index + '">' +
      esc(priceOption(price)) +
      '</option>').join('') + '</select></label></div><p class="note" id="catalog-source"></p></fieldset>';
}

function positionPicker() {
  if (!catalog) return '<p class="note">Чтобы выбрать позицию из Excel, нажмите «Загрузить справочник» вверху страницы.</p>';
  return '<fieldset class="catalog-fields"><legend>Выбор из справочника</legend><div class="fields">' +
    '<label>Поиск по названию или коду<input id="catalog-query" type="search" role="combobox" aria-autocomplete="list" ' +
    'aria-controls="catalog-suggestions" aria-expanded="false" autocomplete="off"></label></div>' +
    '<div class="catalog-suggestions" id="catalog-suggestions" role="listbox" aria-label="Варианты из справочника" hidden></div>' +
    '<p class="note" id="catalog-position-price" role="status"></p>' +
    '<p class="note" id="catalog-matches" role="status"></p></fieldset>';
}

function stepForm(index, row, prices) {
  if (index === 4) return '<div class="action"><h3>Позиция готова</h3><p class="note">Цена для заказчика подтверждена.</p></div>';
  const descriptions = [
    'Выберите позицию и укажите объём. Для работ, материалов, доставки и прочего выберите готовую цену из справочника. Часы работы техники указывает главный инженер.',
    'Сверьте объём по проекту и при необходимости скорректируйте его. Укажите общее время работы техники.',
    'Выберите закупочную цену из справочника или введите цену ОМТС.',
    baseCatalogPrice(row) ? 'Подтвердите цену из справочника или укажите скорректированную цену для заказчика.' :
      'Выберите расценку или введите цену для заказчика, затем подтвердите её.'
  ];
  const numericField = (label, name) =>
    '<label>' + label + '<input name="' + name + '" type="number" min="0.01" max="100000000" step="' +
    (name.endsWith('Price') ? 'any' : '0.01') + '" required></label>';
  const fields = [
    () => '<label>Название позиции<input name="name" required maxlength="500" placeholder="Например, мини-экскаватор"></label>' +
      '<label>Тип позиции<select name="category" required><option value="">Выберите тип</option>' +
      categories.map(category => '<option' + (cardFilters.category === category ? ' selected' : '') + '>' + category + '</option>').join('') +
      '</select></label><div class="pair"><label>Единица измерения<select name="unit" required>' +
      [...new Set(['м³', 'м²', 'т', 'шт.', 'смена', 'ч', 'маш.-ч', 'рейс', 'компл.', 'м.п.', 'кг',
        ...(catalog?.positions.map(position => position.unit) ?? []), ...(row?.unit ? [row.unit] : [])])].map(unit => '<option>' + esc(unit) + '</option>').join('') +
      '</select></label>' + numericField('Объём', 'volume') + '</div>',
    () => (hourlyUnit(row.unit) ? '' : numericField('Объём, ' + esc(row.unit), 'volume')) +
      numericField(hourlyUnit(row.unit) ? 'Объём, ' + esc(row.unit) : 'Часы работы, ч', 'hours'),
    () => numericField('Цена ОМТС за единицу, ₽', 'supplyPrice'),
    () => numericField('Цена заказчику за единицу, ₽', 'customerPrice') +
      (row?.supplyPrice != null ? '<button class="btn copy-price" id="copy-price" type="button">Взять цену ОМТС</button>' : '')
  ];
  const title = index === 0 ? '<h3 id="inline-position-title">' +
    (row ? 'Изменить строку' : 'Новая расценка') + '</h3><p class="entry-target" id="entry-target"></p>' :
    '<h3>Действие · ' + steps[index].role + '</h3>';
  return '<form class="action" id="' + (index === 0 ? 'add-line-form' : 'step-form') + '">' + title +
    '<p class="note">' + descriptions[index] +
    '</p>' + (index === 0 ? positionPicker() : pricePicker(prices)) +
    '<div class="fields">' + fields[index]() +
    (index === 0 ? '<div id="inline-structure">' +
      (activeEstimate.sections?.length ? structureField(row?.structure ?? entryStructure) : '') + '</div>' : '') + '</div>' +
    (index === 0 ? '<div id="base-rate"></div><p class="note" id="base-rate-error" role="alert"></p>' : '') +
    '<button class="btn primary" type="submit">' + (index === 0 ? (row ? 'Сохранить изменения' : 'Добавить расценку') : steps[index].action) + '</button>' +
    (index === 0 && row ? '<button class="btn" type="button" id="cancel-line-edit">Отменить редактирование</button>' : '') + '</form>';
}

function renderDrawer(row, status = '', editingCustomerPrice = false) {
  const index = editingCustomerPrice ? 3 : nextStep(row);
  const basePrice = baseCatalogPrice(row);
  const prices = index === 2 || (index === 3 && !basePrice) ? availablePrices(row, index) : [];
  const stage = estimateStage(activeEstimate);
  const canAct = index === stage || index === 4;
  const number = index === 0 ? 'Новая позиция' : 'Позиция сметы № ' + activeEstimate.id;
  const values = row ? [
    ['Тип позиции', row.category], ['Объём', quantity(row.volume) + ' ' + row.unit],
    ...(row.category === 'Механизмы' ? [['Часы механизма', row.hours == null ? '—' : quantity(row.hours) + ' ч']] : []),
    ['Цена ОМТС / ед.', row.supplySkipped ? 'Цена ОМТС не указана' : money(row.supplyPrice)],
    ...(basePrice ? [
      ['Цена из справочника / ед.', money(basePrice.value)],
      ['Расценка из справочника', priceOrigin(basePrice)]
    ] : []),
    ['Цена заказчику / ед.', money(row.customerPrice)],
    ...(row.supplyRate ? [['Источник цены ОМТС', row.supplyRate]] : []),
    ...(row.customerRate ? [['Источник цены заказчику', row.customerRate]] : [])
  ] : [];
  const route = workflowOrder.map((position, order) => {
    const step = steps[position];
    const nextOrder = index === 4 ? workflowOrder.length : workflowOrder.indexOf(index);
    const skipped = row && ((position === 1 && row.category !== 'Механизмы') ||
      (position === 2 && row.category !== 'Механизмы'));
    return '<li' + (position === index ? ' aria-current="step"' : '') + '><span class="step-icon" aria-hidden="true">' +
      (skipped ? '–' : order < nextOrder ? '✓' : order + 1) + '</span><span>' + step.role + '</span><span class="route-status">' +
      (skipped ? 'Не требуется' : position === index && index === stage ? 'Сейчас' : order < nextOrder ? 'Выполнено' : 'Ожидает') + '</span></li>';
  }).join('');

  dialog.innerHTML = '<div class="drawer"><header class="drawer-head"><div><p class="eyebrow">' + number + '</p>' +
    '<h2 id="drawer-title" tabindex="-1">' + esc(row ? row.name : 'Добавить позицию') + '</h2></div>' +
    '<button class="btn drawer-close" data-close-drawer type="button" aria-label="Закрыть панель">×</button>' +
    '<button class="btn drawer-back" data-close-drawer type="button">К позициям сметы</button></header>' +
    '<div class="drawer-body"><ol class="route" aria-label="Маршрут позиции">' + route + '</ol>' +
    (values.length ? '<dl class="detail">' + values.map(([label, value]) =>
      '<div><dt>' + label + '</dt><dd>' + esc(value) + '</dd></div>').join('') + '</dl>' : '') +
    (status ? '<p class="handoff" id="drawer-status" role="status">' + esc(status) + '</p>' : '') +
    (canAct && index !== 0 ? stepForm(index, row, prices) :
      '<p class="note">Действие доступно на этапе «' + steps[index].role + '».</p>') +
    (index === 4 && stage === 3 ? '<button class="btn" id="adjust-customer-price" type="button">Скорректировать цену заказчику</button>' : '') +
    (stage === 0 && row && activeEstimate.sections?.length ?
      '<form class="action position-structure" id="change-structure"><div class="fields">' +
      structureField(row.structure) + '</div><button class="btn" type="submit">Сохранить раздел</button></form>' : '') +
    (stage === 0 && row ? '<button class="btn" id="edit-position" type="button">Изменить строку</button>' +
      '<button class="btn delete-row" id="delete-position" type="button">Удалить строку</button>' : '') +
    '</div></div>';
  for (const button of dialog.querySelectorAll('[data-close-drawer]')) {
    button.onclick = () => dialog.close();
  }
  if (stage === 0 && row) {
    dialog.querySelector('#delete-position').onclick = () => deleteEstimateLine(row);
    dialog.querySelector('#edit-position').onclick = () => {
      editingLine = row;
      dialog.close();
      renderInlineEntry();
      focusInlineEntry();
    };
  }
  const structureForm = dialog.querySelector('#change-structure');
  if (structureForm) {
    structureForm.onsubmit = event => {
      event.preventDefault();
      row.structure = new FormData(structureForm).get('structure');
      const saved = save();
      renderCard();
      notify(saved ? 'Раздел позиции сохранён.' : 'Раздел изменён до обновления страницы.');
    };
  }
  const adjustPrice = dialog.querySelector('#adjust-customer-price');
  if (adjustPrice) {
    adjustPrice.onclick = () => {
      renderDrawer(row, '', true);
      dialog.querySelector('[name="customerPrice"]').focus();
    };
  }
  if (canAct && index !== 0) bindPositionForm(dialog, index, row, prices, basePrice, editingCustomerPrice);
}

function bindPositionForm(surface, index, row, prices = [], basePrice, editingCustomerPrice = false) {
  const form = surface.querySelector(index === 0 ? '#add-line-form' : '#step-form');
  if (!form) return;
  const copyPrice = surface.querySelector('#copy-price');
  if (copyPrice) {
    copyPrice.onclick = () => {
      const field = form.elements.namedItem('customerPrice');
      field.value = row.supplyPrice;
      const picker = surface.querySelector('#catalog-price');
      if (picker) picker.value = '';
      field.focus();
    };
  }
  if (index === 1) {
    const hourly = hourlyUnit(row.unit);
    form.elements.namedItem('hours').value = hourly ? row.volume : row.hours ?? '';
    if (!hourly) form.elements.namedItem('volume').value = row.volume;
  }
  const priceSelect = surface.querySelector('#catalog-price');
  const priceField = form.elements.namedItem(index === 2 ? 'supplyPrice' : 'customerPrice');
  if (index === 3) priceField.value = row.customerPrice ?? basePrice?.value ?? row.supplyPrice ?? '';
  const chosenPrice = () => priceSelect && prices[priceSelect.value];
  if (priceSelect) {
    priceSelect.onchange = () => {
      const price = chosenPrice();
      priceField.value = price?.value ?? '';
      surface.querySelector('#catalog-source').textContent = price ? [
        price.counterparty, price.source,
        price.kind === 'history' ? 'Архивная цена. Проверьте применимость к текущей смете.' : ''
      ].filter(Boolean).join(' · ') : '';
    };
    if (index === 3 && row.customerPrice == null && row.category === 'Механизмы' &&
      (prices[0].kind === 'customer' || row.supplyPrice == null)) {
      priceSelect.value = '0';
      priceSelect.onchange();
    }
  }
  const positionQuery = surface.querySelector('#catalog-query');
  const originalRow = index === 0 ? row : null;
  let chosenPosition = originalRow && catalog?.positions.find(item => item.code === originalRow.catalogCode) || null;
  const baseRate = surface.querySelector('#base-rate');
  const baseRateError = surface.querySelector('#base-rate-error');
  let basePrices = [];
  function renderBaseRate() {
    const position = chosenPosition;
    baseRateError.textContent = '';
    const needsCatalogPrice = categorySelect.value && categorySelect.value !== 'Механизмы';
    basePrices = position?.category === categorySelect.value ? pricesForPosition(position, 3) : [];
    const originalRate = baseCatalogPrice(originalRow);
    if (originalRate && originalRow.category === categorySelect.value &&
      (!position || position.code === originalRow.catalogCode)) {
      basePrices = [originalRate, ...basePrices.filter(price => price.code !== originalRate.code)];
    }
    const selectedPrice = basePrices.findIndex(price => price.code === originalRate?.code);
    baseRate.innerHTML = basePrices.length
      ? '<label>Расценка за единицу<select id="base-price" required>' +
        basePrices.map((price, i) => '<option value="' + i + '"' + (i === selectedPrice ? ' selected' : '') + '>' + esc(priceOption(price)) + '</option>').join('') +
        '</select></label>'
      : needsCatalogPrice
        ? '<p class="note">' + (position?.category === categorySelect.value ? 'У этой позиции нет доступной цены. Выберите другую позицию.' :
          'Выберите позицию из загруженного справочника.') + '</p>'
        : '';
  }
  const categorySelect = form.elements.namedItem('category');
  if (index === 0) {
    const defaultUnits = ['м²', 'м³', 'смена', 'рейс', 'компл.'];
    const setUnit = () => {
      const selection = categories.indexOf(categorySelect.value);
      const position = chosenPosition;
      if (selection >= 0) {
        form.elements.namedItem('unit').value = position?.category === categorySelect.value ? position.unit : defaultUnits[selection];
      }
      renderBaseRate();
    };
    categorySelect.onchange = setUnit;
    if (originalRow) {
      form.elements.namedItem('name').value = originalRow.name;
      categorySelect.value = originalRow.category;
      form.elements.namedItem('volume').value = originalRow.volume;
      if (positionQuery) positionQuery.value = originalRow.name;
    }
    setUnit();
    if (originalRow) form.elements.namedItem('unit').value = originalRow.unit;
    form.elements.namedItem('name').oninput = event => event.target.setCustomValidity('');
  }
  if (positionQuery) {
    const suggestions = surface.querySelector('#catalog-suggestions');
    const preview = surface.querySelector('#catalog-position-price');
    const count = surface.querySelector('#catalog-matches');
    let matches = [];
    let activeIndex = -1;

    function showSuggestions(open) {
      suggestions.hidden = !open;
      positionQuery.setAttribute('aria-expanded', String(open));
      if (!open) {
        suggestions.children[activeIndex]?.setAttribute('aria-selected', 'false');
        activeIndex = -1;
        positionQuery.removeAttribute('aria-activedescendant');
      }
    }

    function drawPositions() {
      const query = positionQuery.value.trim().toLocaleLowerCase('ru');
      const tokens = query.split(/\s+/);
      const found = query ? catalog.positions.filter(position => {
        const text = (position.name + ' ' + position.code).toLocaleLowerCase('ru').replaceAll('ё', 'е');
        const words = text.match(/[а-я]+/g) ?? [];
        return categories.includes(position.category) && tokens.every(raw => {
          const token = raw.replaceAll('ё', 'е');
          if (text.includes(token)) return true;
          if (!/^[а-я]{7,}$/.test(token)) return false;
          const stem = token.replace(/(?:иями|иях|иям|ием|ию|ия|ий|ие)$/, '');
          return stem !== token && words.some(word => word.startsWith(stem));
        });
      }) : [];
      showSuggestions(false);
      matches = found.slice(0, 50);
      suggestions.innerHTML = matches.map((position, i) =>
        '<div id="catalog-option-' + i + '" class="catalog-option" role="option" aria-selected="false" data-result="' + i + '">' +
        '<strong>' + esc(positionPriceLabel(position)) + '</strong><span>' +
        esc(position.name + ' · ' + position.code) + '</span></div>').join('');
      count.textContent = !query ? '' : found.length ? 'Показано ' + matches.length + ' из ' + found.length : 'Подходящих позиций нет.';
      showSuggestions(matches.length > 0);
    }

    function selectPosition(i) {
      const position = matches[i];
      if (!position) return;
      chosenPosition = position;
      positionQuery.value = position.name;
      preview.textContent = positionPriceLabel(position);
      count.textContent = '';
      showSuggestions(false);
      const name = form.elements.namedItem('name');
      name.value = position.name;
      name.setCustomValidity('');
      categorySelect.value = position.category;
      categorySelect.onchange();
      form.elements.namedItem('volume').focus();
    }

    positionQuery.oninput = () => {
      if (chosenPosition) form.elements.namedItem('name').value = '';
      chosenPosition = null;
      preview.textContent = '';
      drawPositions();
      renderBaseRate();
    };
    positionQuery.onfocus = () => { if (!chosenPosition) drawPositions(); };
    positionQuery.onblur = () => showSuggestions(false);
    suggestions.onmousedown = event => {
      if (event.target.closest('[data-result]')) event.preventDefault();
    };
    suggestions.onclick = event => {
      const option = event.target.closest('[data-result]');
      if (option) selectPosition(Number(option.dataset.result));
    };
    positionQuery.onkeydown = event => {
      if (event.key === 'Escape' && !suggestions.hidden) {
        event.preventDefault();
        showSuggestions(false);
      } else if (event.key === 'Enter' && !suggestions.hidden) {
        event.preventDefault();
        selectPosition(activeIndex < 0 ? 0 : activeIndex);
      } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        if (suggestions.hidden) drawPositions();
        if (suggestions.hidden) return;
        event.preventDefault();
        suggestions.children[activeIndex]?.setAttribute('aria-selected', 'false');
        activeIndex = activeIndex < 0 && event.key === 'ArrowUp' ? matches.length - 1 :
          Math.max(0, Math.min(matches.length - 1, activeIndex + (event.key === 'ArrowDown' ? 1 : -1)));
        const option = suggestions.children[activeIndex];
        option.setAttribute('aria-selected', 'true');
        positionQuery.setAttribute('aria-activedescendant', option.id);
        option.scrollIntoView({ block: 'nearest' });
      }
    };
  }
  form.onsubmit = event => {
    event.preventDefault();
    if (estimateStage(activeEstimate) !== index) return;
    const fields = new FormData(form);
    if (index === 0) {
      const name = fields.get('name').trim();
      if (!name) {
        const input = form.elements.namedItem('name');
        input.setCustomValidity('Введите название позиции.');
        input.reportValidity();
        return;
      }
      const nextId = activeEstimate.rows.reduce((max, item) => Math.max(max, Number(item.id)), 0) + 1;
      row = makeRow(originalRow?.id ?? String(nextId), name, fields.get('category'), fields.get('unit'),
        Number(fields.get('volume')), null, null, null);
      const position = chosenPosition;
      const matchesCatalog = position && position.unit === row.unit && position.category === row.category &&
        (position.name === row.name || position.code === originalRow?.catalogCode);
      const sameItem = !!originalRow && row.category === originalRow.category && row.unit === originalRow.unit &&
        (!position || position.code === originalRow.catalogCode);
      const selected = surface.querySelector('#base-price');
      const price = (matchesCatalog || sameItem) && selected && basePrices[selected.value];
      if (!price && !sameItem && row.category !== 'Механизмы') {
        baseRateError.textContent = 'Выберите позицию и готовую расценку из справочника.';
        (selected || positionQuery || document.querySelector('#load-catalog')).focus();
        return;
      }
      const previousRate = baseCatalogPrice(originalRow);
      if (sameItem) {
        const changedVolume = row.volume !== originalRow.volume;
        row = { ...originalRow, ...row, hours: originalRow.hours, supplyPrice: originalRow.supplyPrice,
          customerPrice: originalRow.customerPrice };
        if (changedVolume && row.category === 'Механизмы') {
          row.volumeChecked = false;
          row.hours = null;
        }
        if (price && price.code !== previousRate?.code) {
          row.customerPrice = null;
          delete row.customerRate;
        }
      }
      if (price) row.basePrice = { ...price };
      if (matchesCatalog) row.catalogCode = position.code;
      row.structure = fields.get('structure') || '';
      if (originalRow) activeEstimate.rows[activeEstimate.rows.indexOf(originalRow)] = row;
      else activeEstimate.rows.push(row);
      entryStructure = row.structure;
      editingLine = null;
      if (sectionFilter && row.structure !== sectionFilter && !row.structure.startsWith(sectionFilter + '/')) {
        sectionFilter = row.structure;
      }
      cardFilters = { query: '', category: 'all', role: 'all' };
    } else {
      const key = ['volume', 'hours', 'supplyPrice', 'customerPrice'][index];
      row[key] = Number(fields.get(key));
      if (index === 1) {
        row.volume = hourlyUnit(row.unit) ? row.hours : Number(fields.get('volume'));
        row.volumeChecked = true;
      }
      if (index === 2) delete row.supplySkipped;
      const price = chosenPrice();
      if (index === 3 && basePrice) {
        row.customerRate = row.customerPrice === basePrice.value
          ? priceOrigin(basePrice) : 'Цена скорректирована коммерческим директором';
      } else if (index === 3 && price && row.category === 'Механизмы') {
        row.basePrice = { ...price };
        row.customerRate = row.customerPrice === price.value
          ? priceOrigin(price) : 'Цена скорректирована коммерческим директором';
      } else if (price && price.value === row[key]) {
        row[index === 2 ? 'supplyRate' : 'customerRate'] = priceOrigin(price);
      } else if (index === 3 && row.supplyPrice != null && row.customerPrice === row.supplyPrice) {
        row.customerRate = 'По закупочному тарифу ОМТС';
      } else if (editingCustomerPrice) {
        row.customerRate = 'Цена скорректирована коммерческим директором';
      }
      if (cardFilters.role !== 'all') cardFilters.role = 'all';
    }
    drawerReturn = row.id;
    const saved = save();
    renderCard(index === 0);
    const status = [
      originalRow ? 'Строка изменена.' : 'Расценка добавлена.', 'Объём техники подтверждён.',
      'Закупочная цена техники подтверждена.', 'Цена для заказчика подтверждена.'
    ][index];
    const message = saved ? status : status + ' Изменения сохранены до закрытия страницы.';
    if (index === 0) {
      notify(message);
      focusInlineEntry();
      return;
    }
    renderDrawer(row, message);
    const nextField = surface.querySelector('#step-form input');
    const focusTarget = nextField || surface.querySelector('#drawer-title');
    focusTarget.setAttribute('aria-describedby', 'drawer-status');
    focusTarget.focus();
    notify(message);
  };
}

function openDrawer(row) {
  drawerReturn = row?.id;
  renderDrawer(row);
  dialog.showModal();
  dialog.querySelector('#drawer-title').focus();
}

dialog.addEventListener('close', () => {
  if (!activeEstimate) return;
  const rowButton = [...main.querySelectorAll('[data-row]')].find(button => button.dataset.row === drawerReturn);
  if (rowButton) rowButton.focus();
  else focusInlineEntry();
});

document.querySelector('#cancel-estimate').onclick = () => newEstimateDialog.close();
estimateForm.elements.namedItem('name').oninput = event => event.target.setCustomValidity('');
estimateForm.onsubmit = event => {
  event.preventDefault();
  const fields = new FormData(estimateForm);
  const name = fields.get('name').trim();
  if (!name) {
    const field = estimateForm.elements.namedItem('name');
    field.setCustomValidity('Укажите название объекта.');
    field.reportValidity();
    return;
  }

  const date = new Date();
  const estimate = {
    id: nextEstimateNumber(date),
    name,
    client: fields.get('client').trim(),
    scope: fields.get('scope').trim(),
    date: date.toLocaleDateString('ru-RU'),
    workflowStage: 0,
    rows: []
  };
  estimates.unshift(estimate);
  const saved = save();
  Object.assign(listFilters, { query: '', status: 'all' });
  newEstimateDialog.close();
  location.hash = '#estimate/' + estimate.id;
  notify(saved ? 'Смета № ' + estimate.id + ' создана.' : 'Локальное хранилище недоступно. Смета доступна до закрытия или обновления страницы.');
};

document.querySelector('#close-estimate-section').onclick = () => sectionDialog.close();
sectionForm.elements.namedItem('name').oninput = event => event.target.setCustomValidity('');
sectionForm.elements.namedItem('parent').onchange = () => sectionForm.elements.namedItem('name').setCustomValidity('');
sectionForm.onsubmit = event => {
  event.preventDefault();
  if (!activeEstimate || estimateStage(activeEstimate) !== 0) return;
  const fields = new FormData(sectionForm);
  const name = fields.get('name').trim();
  const sections = activeEstimate.sections ??= [];
  const parent = sections.find(section => section.id === fields.get('parent'));
  const siblings = parent ? parent.children : sections;
  const duplicate = siblings.some(item => item.name.toLocaleLowerCase('ru') === name.toLocaleLowerCase('ru'));
  if (!name || duplicate) {
    const field = sectionForm.elements.namedItem('name');
    field.setCustomValidity(duplicate ? 'Такое наименование уже есть на этом уровне.' : 'Введите наименование.');
    field.reportValidity();
    return;
  }
  const nextSectionId = siblings.reduce((max, entry) => Math.max(max, Number(entry.id)), 0) + 1;
  const item = { id: String(nextSectionId), name };
  siblings.push(parent ? item : { ...item, children: [] });
  const saved = save();
  sectionDialog.close();
  sectionFilter = '';
  cardFilters.category = 'all';
  renderCard();
  setEntryStructure(parent ? parent.id + '/' + item.id : item.id);
  notify((parent ? 'Подраздел добавлен.' : 'Раздел добавлен.') +
    (saved ? '' : ' Изменение доступно до обновления страницы.'));
};

function renderScreen(focusHeading = false) {
  const match = location.hash.match(/^#estimate\/(.+)$/);
  const estimate = match ? estimates.find(item => item.id === match[1]) : null;
  if (dialog.open) dialog.close();
  if (newEstimateDialog.open) newEstimateDialog.close();
  if (sectionDialog.open) sectionDialog.close();
  if (estimate !== activeEstimate) {
    cardFilters = { query: '', category: 'all', role: 'all' };
    sectionFilter = '';
    entryStructure = '';
    editingLine = null;
  }
  activeEstimate = estimate;
  if (estimate) renderCard();
  else renderList();
  document.title = estimate ? 'Смета № ' + estimate.id + ' · Русич' : 'Сметы · Русич';
  if (focusHeading) {
    const heading = main.querySelector('h1');
    heading.tabIndex = -1;
    heading.focus();
    window.scrollTo(0, 0);
  }
}
const loadCatalog = document.querySelector('#load-catalog');
const catalogFile = document.querySelector('#catalog-file');
const catalogFeedback = document.querySelector('#catalog-feedback');
function showCatalogStatus() {
  loadCatalog.textContent = catalog ? 'Обновить справочник' : 'Загрузить справочник';
  loadCatalog.title = catalog ? catalog.name + ' · ' + catalog.positions.length + ' позиций' : '';
}
catalogFile.onchange = async () => {
  const file = catalogFile.files[0];
  catalogFile.value = '';
  if (!file) return;
  catalogFile.disabled = true;
  catalogFeedback.textContent = 'Читаем справочник…';
  try {
    catalog = await priceCatalog.read(file);
    const saved = priceCatalog.save(catalog);
    renderInlineEntry();
    catalogFeedback.textContent = 'Загружено позиций: ' + catalog.positions.length +
      (saved ? '.' : '. Справочник доступен до обновления страницы.');
  } catch (error) {
    catalogFeedback.textContent = error instanceof RangeError ? 'Не удалось открыть книгу Excel.' : error.message;
  } finally {
    catalogFile.disabled = false;
    showCatalogStatus();
  }
};
showCatalogStatus();
window.addEventListener('hashchange', () => renderScreen(true));
renderScreen();
</script>
</body>
</html>
