<script>
'use strict';

const priceCatalog = (() => {
  const storageKey = 'rusich-price-catalog-v1';
  const xmlDecoder = new TextDecoder();
  const one = (node, name) => node.getElementsByTagNameNS('*', name)[0];
  const all = (node, name) => [...node.getElementsByTagNameNS('*', name)];
  const clean = value => String(value ?? '').trim();

  function xml(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (one(doc, 'parsererror')) throw new Error('Не удалось прочитать содержимое книги Excel.');
    return doc;
  }

  // Use the ZIP central directory so archives with deferred local sizes also work.
  function archive(buffer) {
    const view = new DataView(buffer);
    let end = buffer.byteLength - 22;
    const limit = Math.max(0, end - 65535);
    while (end >= limit && (view.getUint32(end, true) !== 0x06054b50 ||
      end + 22 + view.getUint16(end + 20, true) !== buffer.byteLength)) end--;
    if (end < limit) throw new Error('Выберите книгу Excel в формате .xlsx.');
    let offset = view.getUint32(end + 16, true);
    const count = view.getUint16(end + 10, true);
    const entries = new Map();
    for (let i = 0; i < count; i++) {
      if (view.getUint32(offset, true) !== 0x02014b50) throw new Error('Повреждённая книга Excel.');
      const nameLength = view.getUint16(offset + 28, true);
      const name = xmlDecoder.decode(new Uint8Array(buffer, offset + 46, nameLength));
      entries.set(name, {
        method: view.getUint16(offset + 10, true),
        size: view.getUint32(offset + 20, true),
        expandedSize: view.getUint32(offset + 24, true),
        local: view.getUint32(offset + 42, true)
      });
      offset += 46 + nameLength + view.getUint16(offset + 30, true) + view.getUint16(offset + 32, true);
    }
    return async name => {
      const entry = entries.get(name);
      if (!entry) return null;
      const { local, method, size, expandedSize } = entry;
      if (expandedSize > 30_000_000 || view.getUint32(local, true) !== 0x04034b50) {
        throw new Error('Не удалось открыть лист Excel.');
      }
      const start = local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true);
      const bytes = new Uint8Array(buffer, start, size);
      if (method === 0) return xmlDecoder.decode(bytes);
      if (method !== 8) throw new Error('Формат сжатия книги Excel не поддерживается.');
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Response(stream).text();
    };
  }

  function records(sheet, strings, expectedHeader) {
    const rows = all(sheet, 'row').map(row => {
      const cells = {};
      for (const cell of row.children) {
        const column = cell.getAttribute('r').match(/^[A-Z]+/)?.[0];
        const type = cell.getAttribute('t');
        const value = one(cell, 'v')?.textContent ?? '';
        if (type === 's') cells[column] = strings[Number(value)] ?? '';
        else if (type === 'inlineStr') cells[column] = all(cell, 't').map(t => t.textContent).join('');
        else if ((!type || type === 'n') && value !== '') cells[column] = Number(value);
        else if (type !== 'e') cells[column] = value;
      }
      return cells;
    });
    const headerIndex = rows.findIndex(row => row.A === expectedHeader);
    if (headerIndex < 0) throw new Error('В книге отсутствуют заголовки справочника.');
    const headers = Object.entries(rows[headerIndex]);
    return rows.slice(headerIndex + 1).map(row =>
      Object.fromEntries(headers.map(([column, header]) => [header, row[column]])));
  }

  async function read(file) {
    if (file.size > 20_000_000) throw new Error('Размер справочника превышает 20 МБ.');
    const part = archive(await file.arrayBuffer());
    const bookText = await part('xl/workbook.xml');
    const linksText = await part('xl/_rels/workbook.xml.rels');
    if (!bookText || !linksText) throw new Error('Выберите книгу Excel в формате .xlsx.');
    const book = xml(bookText);
    const links = new Map(all(xml(linksText), 'Relationship').map(link => [
      link.getAttribute('Id'), link.getAttribute('Target')
    ]));
    const sheets = new Map(all(book, 'sheet').map(sheet => [
      sheet.getAttribute('name'), links.get(sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id'))
    ]));
    const sharedText = await part('xl/sharedStrings.xml');
    const strings = sharedText
      ? all(xml(sharedText), 'si').map(item => all(item, 't').map(t => t.textContent).join(''))
      : [];
    async function sheet(name, header) {
      const target = sheets.get(name);
      if (!target) throw new Error('В книге отсутствует лист «' + name + '».');
      const text = await part(new URL(target, 'https://xlsx.invalid/xl/').pathname.slice(1));
      if (!text) throw new Error('Не удалось прочитать лист «' + name + '».');
      return records(xml(text), strings, header);
    }

    const positions = (await sheet('Позиции', 'Код позиции')).map(row => ({
      code: clean(row['Код позиции']), category: clean(row['Категория']),
      name: clean(row['Наименование']), unit: clean(row['Ед. изм.']), prices: []
    })).filter(item => item.code && item.category && item.name && item.unit);
    if (!positions.length) throw new Error('В справочнике нет позиций.');
    const byCode = new Map(positions.map(item => [item.code, item]));
    const uses1904 = ['1', 'true'].includes(one(book, 'workbookPr')?.getAttribute('date1904'));
    const epoch = uses1904 ? Date.UTC(1904, 0, 1) : Date.UTC(1899, 11, 30);
    const iso = value => {
      if (typeof value === 'number' && value > 0 && value < 2_958_000) {
        return new Date(epoch + Math.floor(value) * 86400000).toISOString().slice(0, 10);
      }
      const s = clean(value);
      return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : '';
    };
    function add(code, row, kind, value, date, expires = '', confirmed = '') {
      const position = byCode.get(clean(code));
      const priceCode = clean(row['Код цены']);
      if (!position || !priceCode || typeof value !== 'number' || value < 0.01 || value > 100000000) return;
      const unit = clean(row['Ед. изм.']);
      if (unit && unit !== position.unit) return;
      if (position.prices.some(price => price.code === priceCode)) return;
      position.prices.push({
        code: priceCode, kind, value, date, expires, confirmed,
        vat: clean(row['Режим НДС']) || 'НДС по источнику',
        source: clean(row['Файл сметы'] || row['Источник цены (ссылка или №)'] || row['Счёт №']),
        counterparty: clean(row['Поставщик'] || row['Заказчик или объект'])
      });
    }
    for (const row of await sheet('История', 'Код цены')) {
      const price = typeof row['Цена для сметы, руб.'] === 'number'
        ? row['Цена для сметы, руб.'] : row['Цена, руб.'];
      add(row['Код позиции'], row, 'history', price, iso(row['Дата по источнику']));
    }
    for (const [name, kind, counterparty] of [
      ['Закупка ОМТС', 'supply', 'Поставщик'], ['Для заказчика', 'customer', 'Заказчик или объект']
    ]) {
      for (const row of await sheet(name, 'Код цены')) {
        const date = iso(row['Дата цены']);
        const expires = iso(row['Действует по']);
        const confirmed = iso(row['Дата подтверждения']);
        const status = clean(row['Статус записи']);
        if (status && status !== 'Подтверждена') continue;
        if (!date || !confirmed || !clean(row[counterparty]) ||
          !clean(row['Источник цены (ссылка или №)']) || !clean(row['Подтвердил']) ||
          !['Без НДС', 'С НДС'].includes(row['Режим НДС']) ||
          (row['Действует по'] && (!expires || expires < date))) continue;
        add(row['Код позиции'], row, kind, row['Цена, руб.'], date, expires, confirmed);
      }
    }
    if (sheets.has('Счета ОМТС')) {
      for (const row of await sheet('Счета ОМТС', 'Код цены')) {
        if (row['Статус'] !== 'В справочнике' || row['Решение'] !== 'Подтвердить') continue;
        const confirmed = iso(row['Дата проверки']);
        const date = iso(row['Дата счёта']);
        if (!date || !confirmed) continue;
        add(row['Подтверждённый код'], {
          ...row, 'Ед. изм.': row['Единица для сравнения'], 'Режим НДС': row['Режим НДС цены']
        }, 'supply', row['Цена за ед., руб.'], date, iso(row['Действует по']), confirmed);
      }
    }
    return { name: file.name, positions };
  }

  function load() {
    try {
      return JSON.parse(localStorage.getItem(storageKey));
    } catch {
      return null;
    }
  }

  function save(data) {
    try {
      localStorage.setItem(storageKey, JSON.stringify(data));
      return true;
    } catch {
      return false;
    }
  }

  return { read, load, save };
})();

function decimalParts(value) {
  const [decimal, exponent = '0'] = String(value).toLowerCase().split('e');
  const [whole, fraction = ''] = decimal.split('.');
  return { coefficient: BigInt(whole + fraction), scale: fraction.length - Number(exponent) };
}

function lineAmountCents(volume, unitPrice) {
  if (volume == null || unitPrice == null) return null;
  const quantity = Number(volume);
  const price = Number(unitPrice);
  if (!Number.isFinite(quantity) || !Number.isFinite(price)) return null;
  const units = decimalParts(quantity);
  const tariff = decimalParts(price);
  const coefficient = units.coefficient * tariff.coefficient;
  const scale = units.scale + tariff.scale - 2;
  if (scale <= 0) return Number(coefficient * 10n ** BigInt(-scale));
  const divisor = 10n ** BigInt(scale);
  const magnitude = coefficient < 0n ? -coefficient : coefficient;
  const cents = (magnitude + divisor / 2n) / divisor;
  return Number(coefficient < 0n ? -cents : cents);
}

function readEstimateNumber(raw, resolveReference) {
  const input = raw.trim();
  const formula = input.startsWith('=');
  const expression = (formula ? input.slice(1) : input).trim()
    .replace(/(?<=\d)[ \u00a0\u202f](?=\d{3}(?:\D|$))/g, '').replaceAll(',', '.');
  const number = /^(?:\d+(?:\.\d*)?|\.\d+)$/;
  if (!formula) return number.test(expression) ? Number(expression) : NaN;
  const tokens = expression.match(/@\d+|\d+(?:\.\d*)?|\.\d+|\S/g) ?? [];
  let index = 0;
  const take = token => tokens[index] === token && ++index;

  function atom() {
    if (take('+')) return atom();
    if (take('-')) return -atom();
    if (take('(')) {
      const value = sum();
      return take(')') ? value : NaN;
    }
    const token = tokens[index++];
    if (token?.startsWith('@')) return resolveReference?.(token.slice(1)) ?? NaN;
    return number.test(token) ? Number(token) : NaN;
  }

  function product() {
    let value = atom();
    while (tokens[index] === '*' || tokens[index] === '/') {
      const operator = tokens[index++];
      const operand = atom();
      if (operator === '/' && operand === 0) return NaN;
      value = operator === '*' ? value * operand : value / operand;
    }
    return value;
  }

  function sum() {
    let value = product();
    while (tokens[index] === '+' || tokens[index] === '-') {
      const operator = tokens[index++];
      const operand = product();
      value = operator === '+' ? value + operand : value - operand;
    }
    return value;
  }

  const result = sum();
  return index === tokens.length && Number.isFinite(result) ? Number(result.toPrecision(15)) : NaN;
}

function validEstimateValue(value) {
  return Number.isFinite(value) && value >= 0.01 && value <= 100000000;
}

function evaluateEstimateVolumes(rows) {
  const byId = new Map(rows.map(row => [row.id, row]));
  const volumes = new Map();
  const visiting = new Set();
  function resolve(id) {
    if (volumes.has(id)) return volumes.get(id);
    const row = byId.get(id);
    if (!row || visiting.has(id)) return NaN;
    visiting.add(id);
    const formula = row.formulas?.volume;
    const value = formula ? readEstimateNumber(formula, resolve) : row.volume;
    visiting.delete(id);
    volumes.set(id, value);
    return value;
  }
  for (const row of rows) resolve(row.id);
  return volumes;
}

function setEstimateFormula(row, key, value) {
  if (value?.startsWith('=')) row.formulas = { ...row.formulas, [key]: value };
  else if (row.formulas?.[key]) {
    row.formulas = { ...row.formulas };
    delete row.formulas[key];
  }
}

function estimateLinePrice(row) {
  if (row.customerPrice != null) return { value: row.customerPrice };
  if (row.engineeringPrice && row.draftPrice != null) {
    return { value: row.draftPrice, source: 'Предварительная цена', origin: 'Предварительная цена', field: 'draftPrice' };
  }
  if ((categoryGroup(row.category) === 'Механизмы' || row.supplyEdited) && !row.supplySkipped && row.supplyPrice != null) {
    return { value: row.supplyPrice, source: 'По цене ОМТС', origin: 'По закупочному тарифу ОМТС', vat: row.supplyVat, field: 'supplyPrice' };
  }
  if (row.draftPrice != null) return { value: row.draftPrice, source: 'Предварительная цена', origin: 'Предварительная цена', field: 'draftPrice' };
  const rate = baseCatalogPrice(row);
  return rate ? { value: rate.value, source: 'Из справочника', origin: priceOrigin(rate), vat: rate.vat } : { value: null };
}

function estimateLineAmount(row) {
  return lineAmountCents(row.volume, estimateLinePrice(row).value);
}

function groupRows(group) {
  return group.entries.flatMap(entry => entry.row ? [entry.row] : entry.rows);
}

function sectionSubtotal(rows) {
  return rows.reduce((sum, row) => sum + (estimateLineAmount(row) ?? 0), 0);
}

function addsEstimateVat(category) {
  return category === 'Работы' || categoryGroup(category) === 'Механизмы';
}

function manualPriceVat(category) {
  return addsEstimateVat(category) ? 'Без НДС' : 'С НДС';
}

const estimateAmountLabels = {
  'Работы': 'Всего работы',
  'Материалы': 'Всего материалы',
  'Механизмы': 'Всего машины, механизмы и доставка',
  'Прочее': 'Всего прочее'
};

function estimateAmountCategory(category) {
  const group = categoryGroup(category);
  return Object.hasOwn(estimateAmountLabels, group) ? group : 'Прочее';
}

function estimateVatLabel(rate) {
  return rate == null ? 'НДС (процент не задан)' : 'НДС ' + quantity(rate) + '%';
}

function estimateTotals(estimate) {
  const amounts = { 'Работы': 0, 'Материалы': 0, 'Механизмы': 0, 'Прочее': 0 };
  let missing = 0;
  for (const row of estimate.rows) {
    const amount = estimateLineAmount(row);
    if (amount == null) {
      missing++;
      continue;
    }
    amounts[estimateAmountCategory(row.category)] += amount;
  }
  const subtotal = Object.values(amounts).reduce((sum, amount) => sum + amount, 0);
  const rate = estimate.vatRate;
  const vatBase = amounts['Работы'] + amounts['Механизмы'];
  const vat = rate == null ? null : Math.round(vatBase * Math.round(rate * 100) / 10000);
  return { amounts, subtotal, vat, total: vat == null ? null : subtotal + vat, missing };
}

function renderEstimateTotals(estimate, totals, groups) {
  const { amounts, subtotal, vat, total } = totals;
  const showMoney = value => value == null ? '—' : money(value / 100);
  const line = (label, value) => '<div><dt>' + label + '</dt><dd>' + showMoney(value) + '</dd></div>';
  return '<section class="panel panel-head estimate-totals" aria-labelledby="estimate-totals-title">' +
    '<h2 id="estimate-totals-title" tabindex="-1">Итоги сметы</h2>' +
    (estimate.sections?.length ? '<details><summary>Суммы по разделам</summary><dl class="detail">' + groups.map(group =>
      line(group.section ? esc(sectionLabel(estimate, group.section.id)) : 'Без раздела', sectionSubtotal(groupRows(group)))
    ).join('') + line('Итого по всем строкам до начисления НДС', subtotal) + '</dl></details>' : '') +
    '<dl class="detail">' +
    Object.entries(estimateAmountLabels).map(([category, label]) => line(label, amounts[category])).join('') +
    line('ИТОГО по смете до начисления НДС', subtotal) + line(estimateVatLabel(estimate.vatRate), vat) +
    line('ИТОГО с НДС', total) + '</dl>' +
    '<p class="note">НДС начисляется на работы, машины, механизмы и доставку. Материалы и «Прочее» входят в итог по введённым ценам.</p>' +
    '<form class="vat-form" id="estimate-vat-form">' +
      '<label>НДС, %<input name="vatRate" type="number" min="0" max="100" step="0.01" required value="' +
      esc(estimate.vatRate ?? '') + '"></label><button class="btn" type="submit">Сохранить НДС</button></form>' +
    '</section>';
}

function sectionName(name) {
  return name.replace(/^\s*раздел\s*(?:№\s*)?\d+(?:\s*[.\-–—:]\s*|\s+)(?=\S)/iu, '').trim();
}

function numberedSectionName(section, index) {
  return 'Раздел № ' + (index + 1) + '. ' + sectionName(section.name);
}

function sectionOptions(emptyLabel, selected = '') {
  const option = (id, label) => '<option value="' + esc(id) + '"' +
    (id === selected ? ' selected' : '') + '>' + esc(label) + '</option>';
  return option('', emptyLabel) + (activeEstimate.sections ?? []).map((section, index) => {
    const label = numberedSectionName(section, index);
    return option(section.id, label) + section.children.map(child =>
      option(section.id + '/' + child.id, label + ' → ' + child.name)).join('');
  }
  ).join('');
}

function sectionLabel(estimate, key) {
  if (!key) return '';
  const [sectionId, subsectionId] = key.split('/');
  const index = estimate.sections?.findIndex(item => item.id === sectionId) ?? -1;
  if (index < 0) return '';
  const section = estimate.sections[index];
  const label = numberedSectionName(section, index);
  const child = section.children.find(item => item.id === subsectionId);
  return child ? label + ' → ' + child.name : label;
}

function structureField(selected = '') {
  return '<label>Раздел или подраздел сметы<select name="structure">' +
    sectionOptions('Без раздела', selected) + '</select></label>';
}

function sectionEntries(estimate, section) {
  const direct = estimate.rows.filter(row => row.structure === section.id);
  const entries = new Map(direct.map(row => ['r:' + row.id, { row }]));
  for (const child of section.children) {
    entries.set('s:' + child.id, {
      child,
      rows: estimate.rows.filter(row => row.structure === section.id + '/' + child.id)
    });
  }
  const ordered = [];
  for (const key of section.layout ?? []) {
    const entry = entries.get(key);
    if (!entry) continue;
    ordered.push({ key, ...entry });
    entries.delete(key);
  }
  for (const [key, entry] of entries) ordered.push({ key, ...entry });
  return ordered;
}

function unassignedRows(estimate) {
  const keys = new Set((estimate.sections ?? []).flatMap(section =>
    [section.id, ...section.children.map(child => section.id + '/' + child.id)]));
  return estimate.rows.filter(row => !keys.has(row.structure));
}

function orderedGroups(estimate) {
  const sections = (estimate.sections ?? []).map(section => ({
    section, entries: sectionEntries(estimate, section)
  }));
  const unassigned = unassignedRows(estimate);
  if (unassigned.length) {
    const before = sections.findIndex(group => group.section.id === estimate.unassignedBefore);
    sections.splice(before < 0 ? sections.length : before, 0, { entries: unassigned.map(row => ({ row })) });
  }
  return sections;
}

function insertEstimateGroup(estimate, parent, item, insertion) {
  const sections = estimate.sections;
  if (!insertion) {
    if (parent) {
      parent.layout = [...sectionEntries(estimate, parent).map(entry => entry.key), 's:' + item.id];
      parent.children.push(item);
    } else {
      sections.push(item);
    }
    return;
  }
  const anchor = estimate.rows.find(row => row.id === insertion.rowId);
  const [sectionId, childId] = (anchor?.structure ?? insertion.sectionId ?? '').split('/');
  const oldSection = sections.find(section => section.id === sectionId);
  if (parent && parent !== oldSection) {
    parent.layout = [...sectionEntries(estimate, parent).map(entry => entry.key), 's:' + item.id];
    parent.children.push(item);
    return;
  }
  if (!oldSection) {
    const position = sections.findIndex(section => section.id === estimate.unassignedBefore);
    if (!anchor) {
      if (insertion.edge === 'start') sections.unshift(item);
      else sections.push(item);
      return;
    }
    const unassigned = unassignedRows(estimate);
    const split = unassigned.indexOf(anchor) + 1;
    item.layout = unassigned.slice(split).map(row => {
      row.structure = item.id;
      return 'r:' + row.id;
    });
    sections.splice(position < 0 ? sections.length : position, 0, item);
    estimate.unassignedBefore = item.id;
    return;
  }

  const entries = sectionEntries(estimate, oldSection);
  const anchorKey = childId ? 's:' + childId : anchor ? 'r:' + anchor.id : '';
  const cut = anchorKey ? entries.findIndex(entry => entry.key === anchorKey) + 1 :
    insertion.edge === 'start' ? 0 : entries.length;
  const head = entries.slice(0, cut);
  const tail = entries.slice(cut);
  let remainder = [];
  if (anchor && childId) {
    const childRows = head.at(-1)?.rows ?? [];
    remainder = childRows.slice(childRows.indexOf(anchor) + 1);
  }
  if (parent) {
    if (!childId) {
      while (tail[0]?.row) remainder.push(tail.shift().row);
    }
    for (const row of remainder) row.structure = parent.id + '/' + item.id;
    parent.children.push(item);
    parent.layout = [...head.map(entry => entry.key), 's:' + item.id, ...tail.map(entry => entry.key)];
    return;
  }

  if (remainder.length) {
    const child = head.at(-1).child;
    item.children.push({ ...child });
    item.layout = ['s:' + child.id];
    for (const row of remainder) row.structure = item.id + '/' + child.id;
  }
  item.layout ??= [];
  for (const entry of tail) {
    item.layout.push(entry.key);
    if (entry.row) {
      entry.row.structure = item.id;
    } else {
      item.children.push(entry.child);
      for (const row of entry.rows) row.structure = item.id + '/' + entry.child.id;
    }
  }
  const moved = new Set(tail.filter(entry => entry.child).map(entry => entry.child.id));
  oldSection.children = oldSection.children.filter(child => !moved.has(child.id));
  oldSection.layout = head.map(entry => entry.key);
  sections.splice(sections.indexOf(oldSection) + 1, 0, item);
}

function appendDirectRow(estimate, structure, rowId, placement) {
  const section = estimate.sections?.find(item => item.id === structure);
  if (!section) return;
  const key = 'r:' + rowId;
  const layout = sectionEntries(estimate, section).map(entry => entry.key).filter(id => id !== key);
  const after = layout.indexOf('r:' + placement?.afterId);
  layout.splice(placement?.atStart ? 0 : after < 0 ? layout.length : after + 1, 0, key);
  section.layout = layout;
}

function insertEstimateLine(estimate, row, placement) {
  appendDirectRow(estimate, row.structure, row.id, placement);
  const sameGroup = item => (item.structure || '') === row.structure;
  const index = placement?.atStart ? estimate.rows.findIndex(sameGroup) :
    estimate.rows.findIndex(item => item.id === placement?.afterId && sameGroup(item));
  estimate.rows.splice(index < 0 ? estimate.rows.length : index + (placement?.atStart ? 0 : 1), 0, row);
}

function showSectionForm(parentId = '', insertion = null, fromToolbar = false) {
  sectionInsertion = insertion;
  sectionToolbarScroll = fromToolbar ? window.scrollY : null;
  sectionForm.reset();
  const parent = sectionForm.elements.namedItem('parent');
  const anchorStructure = activeEstimate.rows.find(row => row.id === insertion?.rowId)?.structure;
  const anchorParent = (anchorStructure ?? insertion?.sectionId ?? '').split('/')[0];
  const sections = (activeEstimate.sections ?? []).filter(section => !insertion || section.id === anchorParent);
  const onlySubsection = insertion?.edge === 'start' && parentId;
  const onlySection = !anchorParent || (insertion?.edge === 'end' && anchorParent === insertion.sectionId);
  parent.innerHTML = (onlySubsection ? '' : '<option value="">Верхний уровень (раздел)</option>') +
    (insertion && onlySection ? [] : sections).map(section =>
      '<option value="' + esc(section.id) + '">' + esc(sectionLabel(activeEstimate, section.id)) + '</option>').join('');
  parent.value = parentId;
  sectionForm.elements.namedItem('name').setCustomValidity('');
  const note = document.querySelector('#section-insertion-note');
  note.textContent = insertion?.rowId
    ? 'Будет вставлено после выбранной строки. Следующие строки этой группы перейдут под новый заголовок.'
    : insertion?.edge === 'start' ? 'Будет вставлено перед первой строкой.' :
      insertion?.edge === 'end' ? 'Будет вставлено после выбранной группы.' : '';
  sectionDialog.showModal();
  sectionForm.elements.namedItem('name').focus();
}

function deleteEstimateSection(key, fromToolbar = false) {
  const estimate = activeEstimate;
  if (!estimate) return;
  const [sectionId, childId] = key.split('/');
  const section = estimate.sections?.find(item => item.id === sectionId);
  const target = childId ? section?.children.find(item => item.id === childId) : section;
  if (!target) return;
  const belongs = value => value === key || (!childId && value?.startsWith(key + '/'));
  const affected = estimate.rows.filter(row => belongs(row.structure));
  const destination = childId ? sectionId : '';
  const kind = childId ? 'подраздел' : 'раздел';
  const consequence = affected.length ? '\nРасценки будут перенесены ' +
    (childId ? 'в раздел «' + section.name + '».' : 'в группу «Без раздела».') : '';
  const childrenNote = !childId && section.children.length ? ' Вместе с подразделами.' : '';
  if (!window.confirm('Удалить ' + kind + ' «' + target.name + '»?' + childrenNote + consequence)) return;
  const scrollPosition = fromToolbar ? window.scrollY : null;
  const entries = childId ? sectionEntries(estimate, section) : [];
  for (const row of affected) row.structure = destination;
  if (childId) {
    section.children = section.children.filter(item => item.id !== childId);
    section.layout = entries.flatMap(entry => entry.key === 's:' + childId
      ? affected.map(row => 'r:' + row.id) : [entry.key]);
  } else {
    if (estimate.unassignedBefore === sectionId || !estimate.unassignedBefore) {
      estimate.unassignedBefore = estimate.sections[estimate.sections.indexOf(section) + 1]?.id ?? '';
    }
    estimate.sections = estimate.sections.filter(item => item.id !== sectionId);
  }
  if (belongs(sectionFilter)) sectionFilter = destination;
  if (belongs(entryStructure)) entryStructure = destination;
  const entry = document.querySelector('#inline-position-content');
  const select = entry?.querySelector('[name="structure"]');
  if (select && belongs(select.value)) select.value = destination;
  const saved = save();
  renderCard();
  setEntryStructure(entryStructure, false);
  const focusTarget = document.querySelector(fromToolbar && estimate.sections.length ?
    '#section-to-delete' : '#add-estimate-section');
  focusTarget?.focus({ preventScroll: fromToolbar });
  if (scrollPosition != null) window.scrollTo(0, scrollPosition);
  notify((childId ? 'Подраздел удалён.' : 'Раздел удалён.') +
    (saved ? '' : ' Изменение доступно до обновления страницы.'));
}

function moveVisibleEstimateLines(estimate, rows, destination) {
  if (!sectionLabel(estimate, destination)) return;
  const moving = rows.filter(row => row.structure !== destination);
  if (!moving.length) {
    notify('Показанные позиции уже в выбранном разделе.');
    return;
  }
  if (!window.confirm('Перенести показанные позиции (' + moving.length + ') в «' +
    sectionLabel(estimate, destination) + '»?')) return;
  const moved = new Set(moving);
  estimate.rows = estimate.rows.filter(row => !moved.has(row));
  for (const row of moving) {
    row.structure = destination;
    insertEstimateLine(estimate, row);
  }
  sectionFilter = destination;
  estimate.lastEntryStructure = destination;
  const saved = save();
  editingLine = null;
  renderCard(true);
  setEntryStructure(destination, false);
  notify('Перенесено позиций: ' + moving.length + (saved ? '.' : '. Изменение доступно до обновления страницы.'));
}

function deleteEstimateLine(row) {
  if (!row) return;
  const dependent = activeEstimate.rows.find(item => item.formulas?.volume?.match(/@\d+/g)?.includes('@' + row.id));
  if (dependent) {
    notify('На эту позицию ссылается формула объёма в строке «' + dependent.name + '». Сначала измените эту формулу.');
    return;
  }
  if (!window.confirm('Удалить строку «' + row.name + '» из сметы?')) return;
  const index = [...main.querySelectorAll('[data-delete-line]')].findIndex(button => button.dataset.deleteLine === row.id);
  activeEstimate.rows = activeEstimate.rows.filter(item => item.id !== row.id);
  const section = activeEstimate.sections?.find(item => item.id === row.structure?.split('/')[0]);
  if (section?.layout) section.layout = section.layout.filter(key => key !== 'r:' + row.id);
  if (entryPlacement?.afterId === row.id) setEntryStructure(entryStructure, false);
  if (editingLine === row) {
    editingLine = null;
    renderInlineEntry();
  }
  if (dialog.open) dialog.close();
  const saved = save();
  renderCard();
  const remaining = main.querySelectorAll('[data-delete-line]');
  const focusTarget = remaining[Math.min(Math.max(0, index), remaining.length - 1)] || document.querySelector('#add-filtered-line');
  focusTarget?.focus({ preventScroll: true });
  notify(saved ? 'Строка удалена.' : 'Строка удалена до обновления страницы.');
}
