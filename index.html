    estimate.vatRate = rate;
    const saved = save();
    renderCard();
    document.querySelector('#estimate-vat-form input')?.focus();
    notify(saved ? 'Процент НДС сохранён.' : 'Изменение доступно до обновления страницы.');
  };
  const draw = () => {
    const tabs = document.querySelector('#categories');
    tabs.innerHTML = [['all', 'Все позиции'], ...displayedCategories.map(category => [category, categoryLabel(category)])].map(([value, label]) => {
      const count = value === 'all' ? estimate.rows.length : estimate.rows.filter(row => categoryGroup(row.category) === value).length;
      return '<button type="button" class="tab" data-category="' + value + '" aria-pressed="' +
        (cardFilters.category === value) + '">' + label + ' <small>' + count + '</small></button>';
    }).join('');
    const blockingIds = new Set(blocking.map(row => row.id));
    const visible = estimate.rows.filter(row => {
      const step = steps[nextStep(row, stage)];
      return (!cardFilters.blockingOnly || blockingIds.has(row.id)) &&
        (cardFilters.category === 'all' || cardFilters.category === categoryGroup(row.category)) &&
        (cardFilters.role === 'all' || cardFilters.role === (step ? step.role : 'Готово')) &&
        (!sectionFilter || row.structure === sectionFilter || row.structure?.startsWith(sectionFilter + '/')) &&
        rowMatches(row, cardFilters.query);
    });
    const positionNumbers = new Map(groups.flatMap(groupRows).map((row, index) => [row.id, index + 1]));
    const visibleIds = new Set(visible.map(row => row.id));
    const move = document.querySelector('#move-visible');
    if (move) {
      const destination = document.querySelector('#bulk-destination');
      destination.onchange = () => { move.disabled = !destination.value || !visibleIds.size; };
      destination.onchange();
      move.onclick = () => moveVisibleEstimateLines(estimate,
        groups.flatMap(groupRows).filter(row => visibleIds.has(row.id)), destination.value);
    }
    const renderRow = row => {
      const step = steps[nextStep(row, stage)];
      const { value: unitPrice, source: previewSource } = estimateLinePrice(row);
      const amountCents = lineAmountCents(row.volume, unitPrice);
      const controls = '<div class="row-controls">' +
        (stage === 0 ? '<button type="button" class="btn" data-edit-line="' + esc(row.id) + '">Изменить</button>' : '') +
        '<button type="button" class="btn" data-delete-line="' + esc(row.id) + '">Удалить строку</button>' +
        '<button type="button" class="btn" data-add-after-line="' + esc(row.id) + '">Добавить расценку после</button>' +
        '<button type="button" class="btn" data-insert-after-line="' + esc(row.id) + '">Вставить после</button></div>';
      return '<tr' + (unitPrice == null ? ' class="unpriced-row"' : '') + '><td class="num">' + positionNumbers.get(row.id) +
        '</td><td><button class="text-btn" data-row="' + esc(row.id) + '" type="button">' + esc(row.name) +
        '</button><span class="secondary">' + esc(categoryLabel(row.category)) + '</span>' +
        controls + '</td><td class="num">' + quantity(row.volume) + ' ' + esc(row.unit) +
        '</td><td class="num">' + quantity(row.hours) + '</td><td class="num">' + money(row.supplyPrice) + '</td><td class="num">' +
        (unitPrice == null ? '<span class="pill wait">Без цены</span>' : money(unitPrice)) +
        (previewSource ? '<span class="secondary">' + previewSource + '</span>' : '') +
        '</td><td class="num">' + money(amountCents == null ? null : amountCents / 100) +
        (amountCents != null && step ? '<span class="secondary">Предварительно</span>' : '') +
        '</td><td><span class="pill ' + (step ? 'wait' : 'done') + '">' + (step ? step.missing : 'Готово') +
        '</span></td><td>' + (step ? step.role : '—') + '</td></tr>';
    };
    const rows = [];
    const showEmptyGroups = !cardFilters.query.trim() && cardFilters.role === 'all' && cardFilters.category === 'all';
    function renderHeader(key, name, child) {
      const controls = key ? '<div class="group-controls">' +
        '<button class="btn" type="button" data-entry-section="' + esc(key) + '">Добавить в начало</button>' +
        (child ? '<button class="btn" type="button" data-section-after="' + esc(key) + '">Вставить после подраздела</button>' :
          '<button class="btn" type="button" data-child-section="' + esc(key) + '">+ Подраздел</button>' +
          '<button class="btn" type="button" data-first-child="' + esc(key) + '">Подраздел в начало</button>') +
        '<button class="btn" type="button" data-delete-section="' + esc(key) + '">' +
        (child ? 'Удалить подраздел' : 'Удалить раздел') + '</button></div>' : '';
      return '<tr class="' + (child ? 'subsection-band' : 'section-band') +
        '"><td colspan="' + columns.length + '">' + esc(name) + controls + '</td></tr>';
    }
    for (const group of groups) {
      const section = group.section;
      const allRows = groupRows(group);
      const sectionVisible = allRows.some(row => visibleIds.has(row.id));
      const sectionMatches = !sectionFilter || sectionFilter === section?.id || sectionFilter.startsWith(section?.id + '/');
      if (!sectionVisible && !(showEmptyGroups && sectionMatches)) continue;
      if (section) rows.push(renderHeader(section.id, sectionLabel(estimate, section.id), false));
      else if (estimate.sections) rows.push(renderHeader('', 'Без раздела', false));
      for (const entry of group.entries) {
        if (entry.row) {
          if (visibleIds.has(entry.row.id)) rows.push(renderRow(entry.row));
          continue;
        }
        const key = section.id + '/' + entry.child.id;
        const matching = entry.rows.filter(row => visibleIds.has(row.id));
        if (!matching.length && !(showEmptyGroups && (!sectionFilter || sectionFilter === section.id || sectionFilter === key))) continue;
        rows.push(renderHeader(key, entry.child.name, true), ...matching.map(renderRow));
      }
      if (!section && !estimate.sections?.length) continue;
      const addSection = section ? '<div class="group-controls"><button type="button" class="btn" data-section-after="' +
        esc(section.id) + '">+ Раздел после</button></div>' : '';
      const shownRows = allRows.filter(row => visibleIds.has(row.id));
      const withoutPrice = allRows.filter(row => estimateLineAmount(row) == null).length;
      const preview = allRows.some(row => row.customerPrice == null);
      if (shownRows.length && shownRows.length !== allRows.length) {
        rows.push('<tr class="section-total"><td colspan="6">Итого по показанным строкам</td>' +
          '<td class="num">' + money(sectionSubtotal(shownRows) / 100) + '</td><td colspan="2"></td></tr>');
      }
      rows.push('<tr class="section-total"><td colspan="6">' +
        (section ? 'Итого по разделу «' + esc(sectionLabel(estimate, section.id)) + '»' : 'Итого по строкам без раздела') +
        addSection + '</td>' +
        '<td class="num">' + money(sectionSubtotal(allRows) / 100) + '</td><td colspan="2">' +
        (preview ? (withoutPrice ? 'Без цены: ' + withoutPrice + ' · ' : '') + 'Предварительно' : '') +
        (allRows.some(row => !visibleIds.has(row.id)) ? '<span class="secondary">Весь раздел</span>' : '') + '</td></tr>');
    }
    const emptyMessage = estimate.rows.length ? undefined : 'Смета пуста. Создайте раздел и добавьте первую расценку.';
    document.querySelector('#results').innerHTML = table(columns, rows, emptyMessage) +
      '<div class="foot" role="status">Показано ' + visible.length + ' из ' + estimate.rows.length + '</div>';
  };
  document.querySelector('#categories').onclick = event => {
    const button = event.target.closest('[data-category]');
    if (!button) return;
    cardFilters.category = button.dataset.category;
    draw();
    [...document.querySelectorAll('[data-category]')].find(tab => tab.dataset.category === cardFilters.category).focus();
  };
  document.querySelector('#query').oninput = event => { cardFilters.query = event.target.value; draw(); };
  document.querySelector('#role').onchange = event => {
    cardFilters.role = event.target.value;
    cardFilters.blockingOnly = false;
    draw();
  };
  if (estimate.sections?.length) {
    document.querySelector('#section-filter').onchange = event => { sectionFilter = event.target.value; draw(); };
  }
  document.querySelector('#clear').onclick = () => {
    sectionFilter = '';
    cardFilters = { query: '', category: 'all', role: 'all' };
    renderCard();
    document.querySelector('#query').focus();
  };
  const advanceButton = document.querySelector('#advance-estimate');
  if (advanceButton) advanceButton.onclick = () => advanceEstimate(estimate);
  const showStagePositions = document.querySelector('#show-stage-positions');
  if (showStagePositions) showStagePositions.onclick = () => {
    sectionFilter = '';
    cardFilters = { query: '', category: 'all', role: steps[stage].role, blockingOnly: true };
    renderCard();
    document.querySelector('#card-title').focus();
  };
  document.querySelector('#add-filtered-line').onclick = () => {
    const category = cardFilters.category;
    let structure = sectionFilter || entryStructure;
    if (category !== 'all' && !sectionFilter) {
      const sections = new Set(estimate.rows.filter(row => categoryGroup(row.category) === category)
        .map(row => (row.structure || '').split('/')[0]));
      structure = sections.size === 1 ? [...sections][0] : '';
    }
    prepareInlineEntry(structure);
  };
  const addSectionButton = document.querySelector('#add-estimate-section');
  if (addSectionButton) addSectionButton.onclick = () => showSectionForm('', null, true);
  const insertFirstSection = document.querySelector('#insert-first-section');
  if (insertFirstSection) insertFirstSection.onclick = () => showSectionForm('', { edge: 'start' });
  const addSubsectionButton = document.querySelector('#add-estimate-subsection');
  if (addSubsectionButton && estimate.sections?.length) addSubsectionButton.onclick = () =>
    showSectionForm((sectionFilter || entryStructure).split('/')[0] || estimate.sections[0].id, null, true);
  const sectionToDelete = document.querySelector('#section-to-delete');
  const deleteSelectedSection = document.querySelector('#delete-selected-section');
  sectionToDelete.onchange = () => { deleteSelectedSection.disabled = !sectionToDelete.value; };
  deleteSelectedSection.onclick = () => { if (sectionToDelete.value) deleteEstimateSection(sectionToDelete.value, true); };
  document.querySelector('#results').onclick = event => {
    const button = event.target.closest('button');
    if (!button) return;
    const { childSection, firstChild, entrySection, deleteSection, editLine, deleteLine, row, insertAfterLine, sectionAfter, addAfterLine } = button.dataset;
    if (firstChild) showSectionForm(firstChild, { sectionId: firstChild, edge: 'start' });
    else if (insertAfterLine) {
      const anchor = estimate.rows.find(item => item.id === insertAfterLine);
      if (anchor) showSectionForm('', { rowId: anchor.id });
    } else if (sectionAfter) showSectionForm('', { sectionId: sectionAfter, edge: 'end' });
    else if (childSection) showSectionForm(childSection);
    else if (deleteSection) deleteEstimateSection(deleteSection);
    else if (addAfterLine || entrySection) {
      const anchor = estimate.rows.find(item => item.id === addAfterLine);
      if (addAfterLine && !anchor) return;
      const structure = anchor ? (sectionLabel(estimate, anchor.structure) ? anchor.structure : '') : entrySection;
      const placement = anchor ? { afterId: anchor.id } : { atStart: true };
      prepareInlineEntry(structure, placement);
    }
    else if (editLine) {
      editingLine = estimate.rows.find(item => item.id === editLine);
      renderInlineEntry();
      focusInlineEntry();
    } else if (deleteLine) deleteEstimateLine(estimate.rows.find(item => item.id === deleteLine));
    else if (row) openDrawer(estimate.rows.find(item => item.id === row));
  };
  draw();
  const entry = document.querySelector('#inline-position-content');
  if (!resetEntry && previousEntry?.dataset.estimateId === estimate.id) {
    entry.replaceWith(previousEntry);
    const structure = previousEntry.querySelector('#inline-structure');
    const selected = structure.querySelector('select')?.value;
    structure.innerHTML = estimate.sections?.length ? structureField(selected ?? entryStructure) : '';
    const references = previousEntry.querySelector('[data-volume-reference]');
    if (references) {
      const checked = new Set([...references.querySelectorAll('input:checked')].map(input => input.value));
      references.innerHTML = volumeReferenceOptions(estimate, editingLine, checked);
      references.onchange?.();
    }
  } else {
    renderInlineEntry();
  }
}

function prepareInlineEntry(structure, placement = null) {
  if (editingLine) {
    editingLine = null;
    renderInlineEntry();
  }
  const category = cardFilters.category;
  const categorySelect = document.querySelector('#inline-position-content').querySelector('#add-line-form').elements.namedItem('category');
  if (category !== 'all' && categorySelect.value !== category) {
    categorySelect.value = category;
    categorySelect.onchange();
  }
  setEntryStructure(structure, true, placement);
}

function setEntryStructure(key, focus = true, placement = null) {
  entryStructure = key;
  entryPlacement = placement;
  const entry = document.querySelector('#inline-position-content');
  const target = entry?.querySelector('[name="structure"]');
  if (target && !editingLine) target.value = key;
  const label = entry?.querySelector('#entry-target');
  if (label) {
    const section = sectionLabel(activeEstimate, editingLine?.structure ?? key) || 'Без раздела';
    const anchor = activeEstimate.rows.find(row => row.id === placement?.afterId);
    const suffix = editingLine ? '' : anchor ? ' · после «' + anchor.name + '»' : placement?.atStart ? ' · в начало' : '';
    label.textContent = 'Куда добавляем: ' + section + suffix;
  }
  if (focus) focusInlineEntry();
}

function renderInlineEntry() {
  const entry = document.querySelector('#inline-position-content');
  if (!entry || !activeEstimate) return;
  entry.dataset.estimateId = activeEstimate.id;
  entry.innerHTML = stepForm(0, editingLine);
  bindPositionForm(entry, 0, editingLine);
  setEntryStructure(entryStructure, false, entryPlacement);
  entry.onchange = event => {
    if (event.target.name !== 'structure') return;
    const key = event.target.value;
    if (!editingLine) {
      setEntryStructure(key, false);
    } else {
      const label = entry.querySelector('#entry-target');
      if (label) label.textContent = sectionLabel(activeEstimate, key) || 'Без раздела';
    }
  };
  const cancel = entry.querySelector('#cancel-line-edit');
  if (cancel) cancel.onclick = () => {
    editingLine = null;
    renderInlineEntry();
    focusInlineEntry();
  };
}

function focusInlineEntry() {
  const entry = document.querySelector('#inline-position-content');
  (entry?.querySelector('#catalog-query') || entry?.querySelector('[name="name"]'))?.focus();
}

const priceKinds = { history: 'История', supply: 'Закупка ОМТС', customer: 'Для заказчика' };
const previewPriceKinds = { ...priceKinds, history: 'Историческая цена' };
const directorCanEditVolume = category => category === 'Работы' || category === 'Материалы';
const canAddWithoutCatalogPrice = category => directorCanEditVolume(category) || category === 'Прочее' || category === 'Механизмы';
const needsDirectorPrice = item => item?.category === 'Материалы' &&
  String(item.name ?? '').trim().replace(/\s+/g, ' ').toLocaleLowerCase('ru') === 'расходные материалы';
const baseCatalogPrice = row => needsDirectorPrice(row) ? null : row?.basePrice ?? row?.baseWorkPrice;
const hourlyUnit = unit => ['ч', 'маш.-ч'].includes(unit);

function availablePrices(row, index) {
  const position = catalog?.positions.find(item => item.code === row?.catalogCode && item.unit === row.unit);
  return pricesForPosition(position, index);
}

function pricesForPosition(position, index) {
  if (needsDirectorPrice(position)) return [];
  const date = new Date().toLocaleDateString('sv-SE');
  return (position?.prices ?? []).filter(price => {
    if (index === 2 ? price.kind !== 'supply' : price.kind === 'supply') return false;
    return price.kind === 'history' ||
      price.date <= date && price.confirmed <= date && (!price.expires || price.expires >= date);
  }).sort((a, b) => Number(a.kind === 'history') - Number(b.kind === 'history') || b.date.localeCompare(a.date));
}

function priceOrigin(price) {
  return [priceKinds[price.kind], price.code, price.date, price.vat, price.counterparty, price.source]
    .filter(Boolean).join(' · ');
}

function priceOption(price) {
  return [money(price.value), previewPriceKinds[price.kind], price.date, price.vat, price.code].filter(Boolean).join(' · ');
}

function positionPriceLabel(position) {
  if (needsDirectorPrice(position)) return 'Цену укажет коммерческий директор';
  const purchase = position.category === 'Механизмы' ? pricesForPosition(position, 2)[0] : null;
  const price = purchase ?? pricesForPosition(position, 3)[0];
  return price ? money(price.value) + '/' + position.unit + ' · ' + previewPriceKinds[price.kind] +
    (price.vat === 'С НДС' ? ' · с НДС' : '') : 'Цена отсутствует';
}

function pricePicker(prices) {
  if (!prices.length) return '';
  return '<fieldset class="catalog-fields"><legend>Цена из справочника</legend><div class="fields">' +
    '<label>Расценка<select id="catalog-price"><option value="">Выберите цену</option>' +
    prices.map((price, index) => '<option value="' + index + '">' +
      esc(priceOption(price)) +
      '</option>').join('') + '</select></label></div><p class="note" id="catalog-source"></p></fieldset>';
}

function positionPicker() {
  if (!catalog) return '<p class="note">Чтобы выбрать позицию из Excel, нажмите «Загрузить справочник» вверху страницы.</p>';
  return '<fieldset class="catalog-fields"><legend>Выбор из справочника</legend><div class="fields">' +
    '<label>Поиск по названию или коду<input id="catalog-query" type="search" role="combobox" aria-autocomplete="list" ' +
    'aria-controls="catalog-suggestions" aria-expanded="false" autocomplete="off"></label></div>' +
    '<div class="catalog-suggestions" id="catalog-suggestions" role="listbox" aria-label="Варианты из справочника" hidden></div>' +
    '<p class="note" id="catalog-position-price" role="status"></p>' +
    '<p class="note" id="catalog-matches" role="status"></p></fieldset>';
}

function volumeReferenceOptions(estimate, row, checked = new Set()) {
  return orderedGroups(estimate).flatMap(groupRows).map((item, position) => ({ item, number: position + 1 }))
    .filter(({ item }) => item.id !== row?.id)
    .sort((a, b) => Number(b.item.category === 'Работы') - Number(a.item.category === 'Работы'))
    .map(({ item, number }) => '<label class="volume-link-option"><input type="checkbox" value="' + esc(item.id) +
      '"' + (checked.has(item.id) ? ' checked' : '') + '> <span>№ ' + number + ' · ' + esc(item.name) + ' · ' +
      quantity(item.volume) + ' ' + esc(item.unit) + ' · ' + esc(categoryLabel(item.category)) + '</span></label>').join('');
}

function stepForm(index, row, prices) {
  if (index === 4) return '<div class="action"><h3>Позиция готова</h3><p class="note">Цена для заказчика подтверждена.</p></div>';
  const descriptions = [
    'Выберите расценку из справочника или заполните поле «Название позиции» вручную. Укажите тип позиции, единицу измерения и объём.',
    'Сверьте наименование, объём и предварительную цену.',
    'Укажите объём и закупочную цену за единицу.',
    'Проверьте объём и итоговую цену за единицу для заказчика.'
  ];
  const numericField = (label, name, required = true) =>
    '<label>' + label + '<input name="' + name + '" type="text" maxlength="255" autocomplete="off" ' +
    'aria-describedby="' + (index === 0 ? 'entry-number-help' : 'step-number-help') + '"' +
    (required ? ' required' : '') + '></label>';
  const draftField = () => numericField('Предварительная цена за единицу, ₽', 'draftPrice', false);
  const volumeField = () => numericField('Объём, ' + esc(row.unit), 'volume');
  const referenceOptions = volumeReferenceOptions(activeEstimate, row);
  const fields = [
    () => '<label>Название позиции<input name="name" required maxlength="500" placeholder="Например, мини-экскаватор"></label>' +
      '<label>Тип позиции<select name="category" required><option value="">Выберите тип</option>' +
      displayedCategories.map(category => '<option value="' + category + '"' +
        (cardFilters.category === category ? ' selected' : '') + '>' + categoryLabel(category) + '</option>').join('') +
      '</select></label><div class="pair"><label>Единица измерения<select name="unit" required>' +
      [...new Set(['м³', 'м²', 'т', 'шт.', 'смена', 'ч', 'маш.-ч', 'рейс', 'компл.', 'м.п.', 'кг',
        ...(catalog?.positions.map(position => position.unit) ?? []), ...(row?.unit ? [row.unit] : [])])].map(unit => '<option>' + esc(unit) + '</option>').join('') +
      '</select></label>' + numericField('Объём', 'volume') + '</div>' + draftField(),
    () => '<label>Наименование расценки<input name="name" required maxlength="500"></label>' +
      volumeField() + draftField(),
    () => volumeField() + numericField('Цена ОМТС за единицу ' + (addsEstimateVat(row.category) ? 'без НДС' : 'с НДС') + ', ₽',
      'supplyPrice', needsOmtsPrice(row, 2)),
    () => volumeField() +
      numericField('Цена заказчику за единицу ' + (addsEstimateVat(row.category) ? 'без НДС' : 'с НДС') + ', ₽', 'customerPrice') +
      (row?.supplyPrice != null ? '<button class="btn copy-price" id="copy-price" type="button">Взять цену ОМТС</button>' : '')
  ];
  const title = index === 0 ? '<h3 id="inline-position-title">' +
    (row ? 'Изменить строку' : 'Новая расценка') + '</h3><p class="entry-target" id="entry-target"></p>' :
    '<h3>Действие · ' + steps[index].role + '</h3>';
  return '<form class="action" id="' + (index === 0 ? 'add-line-form' : 'step-form') + '">' + title +
    '<p class="note">' + descriptions[index] +
    '</p>' + (index === 0 ? positionPicker() : pricePicker(prices)) +
    '<div class="fields">' + fields[index]() +
    (index === 0 ? '<div id="inline-structure">' +
      (activeEstimate.sections?.length ? structureField(row?.structure ?? entryStructure) : '') + '</div>' : '') + '</div>' +
    '<p class="note" id="' + (index === 0 ? 'entry-number-help' : 'step-number-help') + '">Введите число или формулу, например =12,5*3.</p>' +
    (referenceOptions ? '<details class="volume-links"><summary>Связать объём с позициями</summary>' +
      '<div class="volume-link-options" data-volume-reference>' + referenceOptions + '</div>' +
      '<button class="btn" data-insert-volume-reference type="button" disabled>Вставить сумму объёмов</button></details>' : '') +
    (index === 0 ? '<div id="base-rate"></div><p class="note" id="base-rate-error" role="alert"></p>' : '') +
    '<button class="btn primary" type="submit">' + (index === 0 ? (row ? 'Сохранить изменения' : 'Добавить расценку') : steps[index].action) + '</button>' +
    (index === 0 && row ? '<button class="btn" type="button" id="cancel-line-edit">Отменить редактирование</button>' : '') + '</form>';
}

function renderDrawer(row, status = '', editingStep) {
  const stage = estimateStage(activeEstimate);
  const index = editingStep ?? nextStep(row, stage);
  const basePrice = baseCatalogPrice(row);
  const prices = index === 2 || (index === 3 && !basePrice) ? availablePrices(row, index) : [];
  const canAct = index === stage || index === 4;
  const number = index === 0 ? 'Новая позиция' : 'Позиция сметы № ' + activeEstimate.id;
  const values = row ? [
    ['Тип позиции', categoryLabel(row.category)], ['Объём', quantity(row.volume) + ' ' + row.unit],
    ...(row.category === 'Механизмы' ? [['Часы механизма', row.hours == null ? '—' : quantity(row.hours) + ' ч']] : []),
    ['Цена ОМТС / ед.', row.supplySkipped ? 'Цена ОМТС не указана' : money(row.supplyPrice)],
    ...(row.draftPrice != null ? [['Предварительная цена / ед.', money(row.draftPrice)]] : []),
    ...(basePrice ? [
      ['Цена из справочника / ед.', money(basePrice.value)],
      ['Расценка из справочника', priceOrigin(basePrice)]
    ] : []),
    ['Цена заказчику / ед.', money(row.customerPrice)],
    ...(row.supplyRate ? [['Источник цены ОМТС', row.supplyRate]] : []),
    ...(row.customerRate ? [['Источник цены заказчику', row.customerRate]] : [])
  ] : [];
  const route = workflowOrder.map((position, order) => {
    const step = steps[position];
    const nextOrder = index === 4 ? workflowOrder.length : workflowOrder.indexOf(index);
    const skipped = row && ((position === 1 && row.category !== 'Механизмы' && !row.volumeChecked && index !== 1) ||
      (position === 2 && !needsOmtsPrice(row, stage) && (row.category !== 'Доставка' || row.supplyPrice == null)));
    return '<li' + (position === index ? ' aria-current="step"' : '') + '><span class="step-icon" aria-hidden="true">' +
      (skipped ? '–' : order < nextOrder ? '✓' : order + 1) + '</span><span>' + step.role + '</span><span class="route-status">' +
      (skipped ? 'Не требуется' : position === index && index === stage ? 'Сейчас' : order < nextOrder ? 'Выполнено' : 'Ожидает') + '</span></li>';
  }).join('');

  dialog.innerHTML = '<div class="drawer"><header class="drawer-head"><div><p class="eyebrow">' + number + '</p>' +
    '<h2 id="drawer-title" tabindex="-1">' + esc(row ? row.name : 'Добавить позицию') + '</h2></div>' +
    '<button class="btn drawer-close" data-close-drawer type="button" aria-label="Закрыть панель">×</button>' +
    '<button class="btn drawer-back" data-close-drawer type="button">К позициям сметы</button></header>' +
    '<div class="drawer-body"><ol class="route" aria-label="Маршрут позиции">' + route + '</ol>' +
    (values.length ? '<dl class="detail">' + values.map(([label, value]) =>
      '<div><dt>' + label + '</dt><dd>' + esc(value) + '</dd></div>').join('') + '</dl>' : '') +
    (status ? '<p class="handoff" id="drawer-status" role="status">' + esc(status) + '</p>' : '') +
    (canAct && index !== 0 ? stepForm(index, row, prices) :
      '<p class="note">Действие доступно на этапе «' + steps[index].role + '».</p>') +
    (stage === 1 && index !== 1 ? '<button class="btn" id="adjust-engineering-position" type="button">Изменить наименование, объём и цену</button>' : '') +
    (stage === 2 && index !== 2 ?
      '<button class="btn" id="adjust-supply-price" type="button">Скорректировать цену и объём ОМТС</button>' : '') +
    (index === 4 && stage === 3 ? '<button class="btn" id="adjust-customer-price" type="button">' +
      'Скорректировать цену и объём</button>' : '') +
    (row && activeEstimate.sections?.length ?
      '<form class="action position-structure" id="change-structure"><div class="fields">' +
      structureField(row.structure) + '</div><button class="btn" type="submit">Сохранить раздел</button></form>' : '') +
    (stage === 0 && row ? '<button class="btn" id="edit-position" type="button">Изменить строку</button>' : '') +
    (row ? '<button class="btn delete-row" id="delete-position" type="button">Удалить строку</button>' : '') +
    '</div></div>';
  for (const button of dialog.querySelectorAll('[data-close-drawer]')) {
    button.onclick = () => dialog.close();
  }
  if (row) dialog.querySelector('#delete-position').onclick = () => deleteEstimateLine(row);
  if (stage === 0 && row) {
    dialog.querySelector('#edit-position').onclick = () => {
      editingLine = row;
      dialog.close();
      renderInlineEntry();
      focusInlineEntry();
    };
  }
  const structureForm = dialog.querySelector('#change-structure');
  if (structureForm) {
    structureForm.onsubmit = event => {
      event.preventDefault();
      const structure = new FormData(structureForm).get('structure');
      if (structure !== row.structure) appendDirectRow(activeEstimate, structure, row.id);
      row.structure = structure;
      const saved = save();
      renderCard();
      notify(saved ? 'Раздел позиции сохранён.' : 'Раздел изменён до обновления страницы.');
    };
  }
  for (const [id, step, field] of [
    ['#adjust-engineering-position', 1, 'name'],
    ['#adjust-supply-price', 2, 'supplyPrice'], ['#adjust-customer-price', 3, 'customerPrice']
  ]) {
    const button = dialog.querySelector(id);
    if (!button) continue;
    button.onclick = () => {
      renderDrawer(row, '', step);
      dialog.querySelector('[name="' + field + '"]').focus();
    };
  }
  if (canAct && index !== 0) bindPositionForm(dialog, index, row, prices, basePrice, editingStep === 3);
}

function bindPositionForm(surface, index, row, prices = [], basePrice, editingCustomerPrice = false) {
  const form = surface.querySelector(index === 0 ? '#add-line-form' : '#step-form');
  if (!form) return;
  const priceKey = index === 2 ? 'supplyPrice' : index === 3 ? 'customerPrice' : 'draftPrice';
  const priceField = form.elements.namedItem(priceKey);
  const volumeField = form.elements.namedItem('volume');
  const displayNumber = (key, fallback) => row?.formulas?.[key] ?? fallback ?? '';
  volumeField.value = displayNumber('volume', row?.volume);
  priceField.value = displayNumber(priceKey, index === 2 ? row.supplyPrice ?? row.formulas?.draftPrice ?? omtsCatalogRate(row)?.value :
    index === 3 ? row.formulas?.[estimateLinePrice(row).field] ?? estimateLinePrice(row).value : row?.draftPrice);
  for (const input of [volumeField, priceField]) input.oninput = () => input.setCustomValidity('');
  const referenceList = form.querySelector('[data-volume-reference]');
  const insertReference = form.querySelector('[data-insert-volume-reference]');
  if (referenceList && insertReference) {
    referenceList.onchange = () => { insertReference.disabled = !referenceList.querySelector('input:checked'); };
    insertReference.onclick = () => {
      const checked = [...referenceList.querySelectorAll('input:checked')];
      if (!checked.length) return;
      const sum = checked.map(input => '@' + input.value).join('+');
      const group = checked.length > 1 ? '(' + sum + ')' : sum;
      const current = String(volumeField.value).trim();
      const prefix = current.startsWith('=') ? current + (/[=+*/(-]$/.test(current) ? '' : '+') : '=';
      volumeField.value = prefix + group;
      for (const input of checked) input.checked = false;
      referenceList.onchange();
      volumeField.setCustomValidity('');
      volumeField.focus();
    };
  }
  const copyPrice = surface.querySelector('#copy-price');
  if (copyPrice) {
    copyPrice.onclick = () => {
      const field = form.elements.namedItem('customerPrice');
      field.value = displayNumber('supplyPrice', row.supplyPrice);
      field.setCustomValidity('');
      const picker = surface.querySelector('#catalog-price');
      if (picker) picker.value = '';
      field.focus();
    };
  }
  if (index === 1) {
    const name = form.elements.namedItem('name');
    name.value = row.name;
    name.oninput = () => name.setCustomValidity('');
  }
  const priceSelect = surface.querySelector('#catalog-price');
  const chosenPrice = () => priceSelect && prices[priceSelect.value];
  if (priceSelect) {
    priceSelect.onchange = () => {
      const price = chosenPrice();
      priceField.value = price?.value ?? '';
      priceField.setCustomValidity('');
      surface.querySelector('#catalog-source').textContent = price ? [
        price.counterparty, price.source,
        price.kind === 'history' ? 'Архивная цена. Проверьте применимость к текущей смете.' : ''
      ].filter(Boolean).join(' · ') : '';
    };
    if (index === 3 && priceField.value === '' && row.category === 'Механизмы') {
      priceSelect.value = '0';
      priceSelect.onchange();
    }
  }
  const positionQuery = surface.querySelector('#catalog-query');
  const originalRow = index === 0 ? row : null;
  let chosenPosition = originalRow && catalog?.positions.find(item => item.code === originalRow.catalogCode) || null;
  const baseRate = surface.querySelector('#base-rate');
  const baseRateError = surface.querySelector('#base-rate-error');
  let basePrices = [];
  function resolvedCategory() {
    const selected = categorySelect.value;
    if (selected !== 'Механизмы') return selected;
    const itemCategory = chosenPosition?.category ?? originalRow?.category;
    return categoryGroup(itemCategory) === selected ? itemCategory : selected;
  }
  function renderBaseRate() {
    const position = chosenPosition;
    baseRateError.textContent = '';
    const category = resolvedCategory();
    const directorPrice = needsDirectorPrice({
      category, name: form.elements.namedItem('name').value
    });
    const needsCatalogPrice = category && !canAddWithoutCatalogPrice(category);
    basePrices = position?.category === category ? pricesForPosition(position, 3) : [];
    const originalRate = baseCatalogPrice(originalRow);
    if (originalRate && originalRow.category === category &&
      (!position || position.code === originalRow.catalogCode)) {
      basePrices = [originalRate, ...basePrices.filter(price => price.code !== originalRate.code)];
    }
    const selectedPrice = basePrices.findIndex(price => price.code === originalRate?.code);
    const readOnlyPrice = estimateStage(activeEstimate) === 1;
    baseRate.innerHTML = basePrices.length
      ? (readOnlyPrice ? '<p class="note">Цена из справочника за единицу — ' + esc(priceOption(basePrices[Math.max(0, selectedPrice)])) + '</p>' : '') +
        '<label' + (readOnlyPrice ? ' hidden' : '') + '>Расценка за единицу<select id="base-price"' + (readOnlyPrice ? ' disabled' : ' required') + '>' +
        basePrices.map((price, i) => '<option value="' + i + '"' + (i === selectedPrice ? ' selected' : '') + '>' + esc(priceOption(price)) + '</option>').join('') +
        '</select></label>'
      : directorPrice || (canAddWithoutCatalogPrice(category) && category !== 'Механизмы') ? '<p class="note">Строку можно добавить без цены. Цену укажет коммерческий директор.</p>'
      : needsCatalogPrice
        ? '<p class="note">' + (position?.category === category ? 'У этой позиции нет доступной цены. Выберите другую позицию.' :
          'Выберите позицию из загруженного справочника.') + '</p>'
        : '';
  }
  const categorySelect = form.elements.namedItem('category');
  if (index === 0) {
    const defaultUnits = ['м²', 'м³', 'смена', 'рейс', 'компл.'];
    const setUnit = () => {
      const selection = categories.indexOf(resolvedCategory());
      const position = chosenPosition;
      if (selection >= 0) {
        form.elements.namedItem('unit').value = position?.category === resolvedCategory() ? position.unit : defaultUnits[selection];
      }
      renderBaseRate();
    };
    categorySelect.onchange = setUnit;
    if (originalRow) {
      form.elements.namedItem('name').value = originalRow.name;
      categorySelect.value = categoryGroup(originalRow.category);
      if (positionQuery) positionQuery.value = originalRow.name;
    }
    setUnit();
    if (originalRow) form.elements.namedItem('unit').value = originalRow.unit;
    form.elements.namedItem('name').oninput = event => {
      event.target.setCustomValidity('');
      renderBaseRate();
    };
  }
  if (positionQuery) {
    const suggestions = surface.querySelector('#catalog-suggestions');
    const preview = surface.querySelector('#catalog-position-price');
    const count = surface.querySelector('#catalog-matches');
    let matches = [];
    let activeIndex = -1;
    const updateCategoryFields = categorySelect.onchange;

    function showSuggestions(open) {
      suggestions.hidden = !open;
      positionQuery.setAttribute('aria-expanded', String(open));
      if (!open) {
        suggestions.children[activeIndex]?.setAttribute('aria-selected', 'false');
        activeIndex = -1;
        positionQuery.removeAttribute('aria-activedescendant');
      }
    }

    function drawPositions() {
      const query = positionQuery.value.trim().toLocaleLowerCase('ru');
      const tokens = query.split(/\s+/);
      const category = categorySelect.value;
      const found = query ? catalog.positions.filter(position => {
        if (category && categoryGroup(position.category) !== category) return false;
        if (needsDirectorPrice(position) && position.unit !== 'компл.' &&
          !query.includes(position.code.toLocaleLowerCase('ru'))) return false;
        const text = (position.name + ' ' + position.code).toLocaleLowerCase('ru').replaceAll('ё', 'е');
        const words = text.match(/[а-я]+/g) ?? [];
        return categories.includes(position.category) && tokens.every(raw => {
          const token = raw.replaceAll('ё', 'е');
          if (text.includes(token)) return true;
          if (!/^[а-я]{7,}$/.test(token)) return false;
          const stem = token.replace(/(?:иями|иях|иям|ием|ию|ия|ий|ие)$/, '');
          return stem !== token && words.some(word => word.startsWith(stem));
        });
      }) : [];
      showSuggestions(false);
      const exactName = query.replace(/\s+/g, ' ');
      const matchesName = position => position.name.trim().replace(/\s+/g, ' ').toLocaleLowerCase('ru') === exactName;
      found.sort((a, b) => Number(matchesName(b)) - Number(matchesName(a)));
      matches = found.slice(0, 50);
      suggestions.innerHTML = matches.map((position, i) =>
        '<div id="catalog-option-' + i + '" class="catalog-option" role="option" aria-selected="false" data-result="' + i + '">' +
        '<strong>' + esc(positionPriceLabel(position)) + '</strong><span>' +
        esc(position.name + ' · ' + position.code) + '</span></div>').join('');
      count.textContent = !query ? '' : (category ? categoryLabel(category) + ' · ' : '') +
        (found.length ? 'Показано ' + matches.length + ' из ' + found.length : 'Подходящих позиций нет.');
      showSuggestions(matches.length > 0);
    }

    function selectPosition(i) {
      const position = matches[i];
      if (!position) return;
      chosenPosition = position;
      positionQuery.value = position.name;
      preview.textContent = positionPriceLabel(position);
      count.textContent = '';
      showSuggestions(false);
      const name = form.elements.namedItem('name');
      name.value = position.name;
      name.setCustomValidity('');
      categorySelect.value = categoryGroup(position.category);
      updateCategoryFields();
      form.elements.namedItem('volume').focus();
    }

    function clearSelection() {
      if (chosenPosition) form.elements.namedItem('name').value = '';
      chosenPosition = null;
      preview.textContent = '';
    }

    categorySelect.onchange = () => {
      if (chosenPosition && categorySelect.value && categoryGroup(chosenPosition.category) !== categorySelect.value) clearSelection();
      updateCategoryFields();
      if (!chosenPosition) drawPositions();
    };
    positionQuery.oninput = () => {
      clearSelection();
      drawPositions();
      renderBaseRate();
    };
    positionQuery.onfocus = () => { if (!chosenPosition) drawPositions(); };
    positionQuery.onblur = () => showSuggestions(false);
    suggestions.onmousedown = event => {
      if (event.target.closest('[data-result]')) event.preventDefault();
    };
    suggestions.onclick = event => {
      const option = event.target.closest('[data-result]');
      if (option) selectPosition(Number(option.dataset.result));
    };
    positionQuery.onkeydown = event => {
      if (event.key === 'Escape' && !suggestions.hidden) {
        event.preventDefault();
        showSuggestions(false);
      } else if (event.key === 'Enter' && !suggestions.hidden) {
        event.preventDefault();
        selectPosition(activeIndex < 0 ? 0 : activeIndex);
      } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        if (suggestions.hidden) drawPositions();
        if (suggestions.hidden) return;
        event.preventDefault();
        suggestions.children[activeIndex]?.setAttribute('aria-selected', 'false');
        activeIndex = activeIndex < 0 && event.key === 'ArrowUp' ? matches.length - 1 :
          Math.max(0, Math.min(matches.length - 1, activeIndex + (event.key === 'ArrowDown' ? 1 : -1)));
        const option = suggestions.children[activeIndex];
        option.setAttribute('aria-selected', 'true');
        positionQuery.setAttribute('aria-activedescendant', option.id);
        option.scrollIntoView({ block: 'nearest' });
      }
    };
  }
  form.onsubmit = event => {
    event.preventDefault();
    const stage = estimateStage(activeEstimate);
    if ((index !== 0 || originalRow) && stage !== index) return;
    const fields = new FormData(form);
    const volumeText = fields.get('volume').trim();
    const nextId = activeEstimate.rows.reduce((max, item) => Math.max(max, Number(item.id)), 0) + 1;
    const rowId = (index === 0 ? originalRow?.id : row.id) ?? String(nextId);
    const candidate = { id: rowId, volume: readEstimateNumber(volumeText) };
    setEstimateFormula(candidate, 'volume', volumeText);
    const volumes = evaluateEstimateVolumes([...activeEstimate.rows.filter(item => item.id !== rowId), candidate]);
    const volume = volumes.get(rowId);
    const priceText = fields.get(priceKey).trim();
    const priceRequired = index === 3 || (index === 2 && needsOmtsPrice(row, stage));
    const amount = !priceText && !priceRequired ? null : readEstimateNumber(priceText);
    for (const [field, value] of [[volumeField, volume], [priceField, amount]]) {
      if (value !== null && !validEstimateValue(value)) {
        field.setCustomValidity(field === volumeField && volumeText.includes('@') ?
          'Проверьте ссылки на позиции и результат. Формула объёма не может ссылаться на себя прямо или через другие строки.' :
          'Введите число или формулу с результатом от 0,01 до 100 000 000.');
        field.reportValidity();
        return;
      }
    }
    const invalidDependent = activeEstimate.rows.find(item => item.id !== rowId && item.formulas?.volume &&
      !validEstimateValue(volumes.get(item.id)));
    if (invalidDependent) {
      volumeField.setCustomValidity('После изменения формула объёма в позиции «' + invalidDependent.name + '» даёт недопустимый результат.');
      volumeField.reportValidity();
      return;
    }
    if (index === 0) {
      const name = fields.get('name').trim();
      if (!name) {
        const input = form.elements.namedItem('name');
        input.setCustomValidity('Введите название позиции.');
        input.reportValidity();
        return;
      }
      row = makeRow(rowId, name, resolvedCategory(), fields.get('unit'),
        volume, null, null, null);
      const position = chosenPosition;
      const matchesCatalog = position && position.unit === row.unit && position.category === row.category &&
        (position.name === row.name || position.code === originalRow?.catalogCode);
      const sameItem = !!originalRow && row.category === originalRow.category && row.unit === originalRow.unit &&
        (!position || position.code === originalRow.catalogCode);
      const selected = surface.querySelector('#base-price');
      const directorPrice = needsDirectorPrice(row);
      const price = !directorPrice && (matchesCatalog || sameItem) && selected && basePrices[selected.value];
      if (!price && !sameItem && !canAddWithoutCatalogPrice(row.category)) {
        baseRateError.textContent = 'Выберите позицию и готовую расценку из справочника.';
        (selected || positionQuery || document.querySelector('#load-catalog')).focus();
        return;
      }
      const previousRate = baseCatalogPrice(originalRow);
      if (sameItem) {
        const changedVolume = row.volume !== originalRow.volume;
        row = { ...originalRow, ...row, hours: originalRow.hours, supplyPrice: originalRow.supplyPrice,
          customerPrice: originalRow.customerPrice };
        if (changedVolume && row.category === 'Механизмы') {
          row.volumeChecked = false;
          row.hours = null;
        }
        if (price && price.code !== previousRate?.code) {
          row.customerPrice = null;
          delete row.customerRate;
          delete row.customerVat;
        }
      }
      if (directorPrice) {
        delete row.basePrice;
        delete row.baseWorkPrice;
      } else if (price) row.basePrice = { ...price };
      if (matchesCatalog) row.catalogCode = position.code;
      if (amount !== (originalRow?.draftPrice ?? null)) {
        row.customerPrice = null;
        setEstimateFormula(row, 'customerPrice', null);
      }
      row.draftPrice = amount;
      setEstimateFormula(row, 'volume', volumeText);
      setEstimateFormula(row, priceKey, priceText);
      row.structure = fields.get('structure') || '';
      if (!originalRow && !row.structure && activeEstimate.sections?.length && !entryPlacement?.afterId) {
        baseRateError.textContent = 'Выберите раздел или подраздел для новой расценки.';
        form.elements.namedItem('structure').focus();
        return;
      }
      if (originalRow) {
        if (originalRow.structure !== row.structure) appendDirectRow(activeEstimate, row.structure, row.id);
        activeEstimate.rows[activeEstimate.rows.indexOf(originalRow)] = row;
        entryPlacement = null;
      } else {
        const placement = entryStructure === row.structure ? entryPlacement : null;
        insertEstimateLine(activeEstimate, row, placement);
        entryPlacement = placement ? { afterId: row.id } : null;
        const next = nextStep(row, 0);
        if (workflowOrder.indexOf(next) < workflowOrder.indexOf(stage)) activeEstimate.workflowStage = next;
      }
      entryStructure = row.structure;
      activeEstimate.lastEntryStructure = row.structure;
      editingLine = null;
      if (sectionFilter && row.structure !== sectionFilter && !row.structure.startsWith(sectionFilter + '/')) {
        sectionFilter = row.structure;
      }
      cardFilters = { query: '', category: cardFilters.category, role: 'all' };
    } else if (index === 1) {
      const name = fields.get('name').trim();
      if (!name) {
        const input = form.elements.namedItem('name');
        input.setCustomValidity('Введите наименование расценки.');
        input.reportValidity();
        return;
      }
      row.name = name;
      row.volume = volume;
      if (amount !== (row.draftPrice ?? null) || (priceText.startsWith('=') && priceText !== row.formulas?.draftPrice)) {
        row.engineeringPrice = amount != null;
        row.customerPrice = null;
        setEstimateFormula(row, 'customerPrice', null);
      }
      row.draftPrice = amount;
      if (row.category === 'Механизмы' && hourlyUnit(row.unit)) row.hours = row.volume;
      row.volumeChecked = true;
      setEstimateFormula(row, 'volume', volumeText);
      setEstimateFormula(row, priceKey, priceText);
    } else {
      const key = priceKey;
      const previousValue = row[key];
      row[key] = amount;
      row.volume = volume;
      if (row.category === 'Механизмы' && hourlyUnit(row.unit)) row.hours = volume;
      setEstimateFormula(row, 'volume', volumeText);
      setEstimateFormula(row, key, priceText);
      const price = chosenPrice() || (index === 2 ? omtsCatalogRate(row) : null);
      if (index === 2) {
        row.supplyEdited = amount != null;
        if (previousValue !== amount) {
          row.engineeringPrice = false;
          row.customerPrice = null;
          setEstimateFormula(row, 'customerPrice', null);
        }
        delete row.supplySkipped;
        if (price?.value === row.supplyPrice) row.supplyVat = price.vat;
        else if (previousValue !== row.supplyPrice) {
          delete row.supplyRate;
          row.supplyVat = manualPriceVat(row.category);
        }
      }
      if (index === 3) {
        row.customerVat = row.customerPrice === row.supplyPrice && (categoryGroup(row.category) === 'Механизмы' || row.supplyEdited) && !row.supplySkipped
          ? row.supplyVat ?? null : basePrice?.vat ?? price?.vat ?? row.customerVat ?? null;
      }
      if (index === 3 && row.customerPrice === row.supplyPrice && (categoryGroup(row.category) === 'Механизмы' || row.supplyEdited) && !row.supplySkipped) {
        row.customerRate = 'По закупочному тарифу ОМТС';
      } else if (index === 3 && basePrice) {
        row.customerRate = row.customerPrice === basePrice.value
          ? priceOrigin(basePrice) : 'Цена скорректирована коммерческим директором';
      } else if (index === 3 && price && row.category === 'Механизмы') {
        row.basePrice = { ...price };
        row.customerRate = row.customerPrice === price.value
          ? priceOrigin(price) : 'Цена скорректирована коммерческим директором';
      } else if (price && price.value === row[key]) {
        row[index === 2 ? 'supplyRate' : 'customerRate'] = priceOrigin(price);
      } else if (editingCustomerPrice) {
        row.customerRate = 'Цена скорректирована коммерческим директором';
      }
      if (cardFilters.role === steps[index].role && !rowsBlockingHandoff(activeEstimate, stage).length) {
        cardFilters.role = 'all';
        cardFilters.blockingOnly = false;
      }
    }
    for (const item of activeEstimate.rows) {
      if (item.id === rowId || !item.formulas?.volume) continue;
      item.volume = volumes.get(item.id);
      if (item.category === 'Механизмы' && hourlyUnit(item.unit) && (item.hours != null || item.volumeChecked)) {
        item.hours = item.volume;
      }
    }
    drawerReturn = row.id;
    const saved = save();
    renderCard(index === 0);
    const status = [
      originalRow ? 'Строка изменена.' : 'Расценка добавлена.', 'Наименование и объём сохранены.',
      'Закупочная цена подтверждена.', 'Цена для заказчика подтверждена.'
    ][index];
    const currentStage = estimateStage(activeEstimate);
    const handoff = currentStage === stage ? '' : ' Смета передана на этап «' + steps[currentStage].role + '».';
    const message = status + handoff + (saved ? '' : ' Изменения сохранены до закрытия страницы.');
    if (index === 0) {
      notify(message);
      focusInlineEntry();
      return;
    }
    renderDrawer(row, message);
    const nextField = surface.querySelector('#step-form input');
    const focusTarget = nextField || surface.querySelector('#drawer-title');
    focusTarget.setAttribute('aria-describedby', 'drawer-status');
    focusTarget.focus();
    notify(message);
  };
}

function openDrawer(row) {
  drawerReturn = row?.id;
  renderDrawer(row);
  dialog.showModal();
  dialog.querySelector('#drawer-title').focus();
}

dialog.addEventListener('close', () => {
  if (!activeEstimate) return;
  const rowButton = [...main.querySelectorAll('[data-row]')].find(button => button.dataset.row === drawerReturn);
  if (rowButton) rowButton.focus();
  else focusInlineEntry();
});

document.querySelector('#cancel-estimate').onclick = () => newEstimateDialog.close();
estimateForm.elements.namedItem('name').oninput = event => event.target.setCustomValidity('');
estimateForm.onsubmit = event => {
  event.preventDefault();
  const fields = new FormData(estimateForm);
  const name = fields.get('name').trim();
  if (!name) {
    const field = estimateForm.elements.namedItem('name');
    field.setCustomValidity('Укажите название объекта.');
    field.reportValidity();
    return;
  }

  const date = new Date();
  const estimate = {
    id: nextEstimateNumber(date),
    name,
    client: fields.get('client').trim(),
    scope: fields.get('scope').trim(),
    date: date.toLocaleDateString('ru-RU'),
    workflowStage: 0,
    rows: []
  };
  estimates.unshift(estimate);
  const saved = save();
  Object.assign(listFilters, { query: '', status: 'all' });
  newEstimateDialog.close();
  location.hash = '#estimate/' + estimate.id;
  notify(saved ? 'Смета № ' + estimate.id + ' создана.' : 'Локальное хранилище недоступно. Смета доступна до закрытия или обновления страницы.');
};

document.querySelector('#close-estimate-section').onclick = () => sectionDialog.close();
sectionForm.elements.namedItem('name').oninput = event => event.target.setCustomValidity('');
sectionForm.elements.namedItem('parent').onchange = () => sectionForm.elements.namedItem('name').setCustomValidity('');
sectionForm.onsubmit = event => {
  event.preventDefault();
  if (!activeEstimate) return;
  const fields = new FormData(sectionForm);
  const enteredName = fields.get('name').trim();
  const sections = activeEstimate.sections ??= [];
  const parent = sections.find(section => section.id === fields.get('parent'));
  const name = parent ? enteredName : sectionName(enteredName);
  const siblings = parent ? parent.children : sections;
  const duplicate = siblings.some(item =>
    (parent ? item.name : sectionName(item.name)).toLocaleLowerCase('ru') === name.toLocaleLowerCase('ru'));
  if (!name || duplicate) {
    const field = sectionForm.elements.namedItem('name');
    field.setCustomValidity(duplicate ? 'Такое наименование уже есть на этом уровне.' : 'Введите наименование.');
    field.reportValidity();
    return;
  }
  const nextSectionId = siblings.reduce((max, entry) => Math.max(max, Number(entry.id)), 0) + 1;
  const item = { id: String(nextSectionId), name };
  if (!parent) item.children = [];
  insertEstimateGroup(activeEstimate, parent, item, sectionInsertion);
  sectionInsertion = null;
  const scrollPosition = sectionToolbarScroll;
  sectionToolbarScroll = null;
  const key = parent ? parent.id + '/' + item.id : item.id;
  activeEstimate.lastEntryStructure = key;
  const saved = save();
  sectionDialog.close();
  sectionFilter = '';
  cardFilters = { query: '', category: 'all', role: 'all' };
  renderCard();
  const enteringPositions = estimateStage(activeEstimate) === 0;
  setEntryStructure(key, enteringPositions && scrollPosition == null);
  if (!enteringPositions || scrollPosition != null) {
    document.querySelector(parent ? '#add-estimate-subsection' : '#add-estimate-section')?.focus({ preventScroll: true });
  }
  if (scrollPosition != null) window.scrollTo(0, scrollPosition);
  notify((parent ? 'Подраздел добавлен.' : 'Раздел добавлен.') +
    (saved ? '' : ' Изменение доступно до обновления страницы.'));
};

function renderScreen(focusHeading = false) {
  const match = location.hash.match(/^#estimate\/(.+)$/);
  const estimate = match ? estimates.find(item => item.id === match[1]) : null;
  if (dialog.open) dialog.close();
  if (exportDialog.open) exportDialog.close();
  if (newEstimateDialog.open) newEstimateDialog.close();
  if (sectionDialog.open) sectionDialog.close();
  sectionInsertion = null;
  sectionToolbarScroll = null;
  if (estimate !== activeEstimate) {
    cardFilters = { query: '', category: 'all', role: 'all' };
    sectionFilter = '';
    entryStructure = sectionLabel(estimate ?? {}, estimate?.lastEntryStructure)
      ? estimate.lastEntryStructure : estimate?.sections?.at(-1)?.id ?? '';
    entryPlacement = null;
    editingLine = null;
  }
  activeEstimate = estimate;
  if (estimate) renderCard();
  else renderList();
  document.title = estimate ? 'Смета № ' + estimate.id + ' · Русич' : 'Сметы · Русич';
  if (focusHeading) {
    const heading = main.querySelector('h1');
    heading.tabIndex = -1;
    heading.focus();
    window.scrollTo(0, 0);
  }
}

function createEstimateWorkbook(estimate, header) {
  const template = estimateWorkbookTemplate;
  const totals = estimateTotals(estimate);
  const rows = [];
  const merges = [...template.merges];
  const worksheetRows = new Map();
  let number = 21;
  let position = 0;
  const xml = value => esc(String(value ?? '').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\ufffe\uffff]/g, ''));
  const cell = (ref, style, value, formula) => {
    const tag = '<c r="' + ref + '" s="' + style + '"';
    if (formula) return tag + '><f>' + xml(formula) + '</f><v>' + value + '</v></c>';
    if (typeof value === 'number') return tag + '><v>' + value + '</v></c>';
    return value ? tag + ' t="inlineStr"><is><t xml:space="preserve">' + xml(value) + '</t></is></c>' : tag + '/>';
  };
  const rowXml = (index, height, cells) =>
    '<row r="' + index + '" ht="' + height + '" customHeight="1">' + cells.join('') + '</row>';
  function tableRow(index, height, entries, mergedStart = '', mergedEnd = '') {
    const columns = 'ABCDEFGHIJKLM';
    const byColumn = new Map(entries.map(([column, ...entry]) => [column, entry]));
    const cells = [...columns].map(column => {
      const [style, value, formula] = byColumn.get(column) ?? [0];
      const mask = column >= mergedStart && column <= mergedEnd ?
        12 + Number(column === mergedStart) + 2 * Number(column === mergedEnd) : 15;
      return cell(column + index, template.grid[style][mask], value, formula);
    });
    if (byColumn.has('N')) cells.push(cell('N' + index, ...byColumn.get('N')));
    return rowXml(index, height, cells);
  }

  function sectionHeading(label, style) {
    number++;
    merges.push('A' + number + ':M' + number);
    rows.push(tableRow(number, 26, [['A', style, label]], 'A', 'M'));
  }

  for (const group of orderedGroups(estimate)) {
    const label = group.section ? sectionLabel(estimate, group.section.id) : (estimate.sections?.length ? 'Без раздела' : '');
    if (label) sectionHeading(label, 112);
    const first = number + 1;
    for (const entry of group.entries) {
      if (entry.child) sectionHeading(entry.child.name, 115);
      for (const source of entry.row ? [entry.row] : entry.rows) {
        number++;
        worksheetRows.set(source.id, number);
        rows.push({ number, source, position: ++position });
      }
    }
    const last = number++;
    merges.push('A' + number + ':I' + number);
    const amount = groupRows(group).reduce((sum, source) => sum + (estimateLineAmount(source) ?? 0), 0) / 100;
    rows.push(tableRow(number, 26, [['A', 92, label ? 'Итого по разделу «' + label + '»' : 'Итого по позициям'],
      ['J', template.numeric.total, amount, first <= last ? 'SUM(J' + first + ':J' + last + ')' : null]], 'A', 'I'));
  }

  function summary(label, value, formula) {
    number++;
    merges.push('A' + number + ':I' + number);
    rows.push(tableRow(number, 26, [['A', 92, label], ['J', template.numeric.total, value, formula]], 'A', 'I'));
    return number;
  }

  const lastSection = number;
  const categoryTotals = Object.fromEntries(Object.entries(estimateAmountLabels).map(([category, label]) =>
    [category, summary(label, totals.amounts[category] / 100, lastSection >= 22 ?
      'SUMIF(N22:N' + lastSection + ',"' + category + '",J22:J' + lastSection + ')' : null)]));
  const subtotal = summary('ИТОГО по смете до начисления НДС', totals.subtotal / 100,
    'SUM(J' + categoryTotals['Работы'] + ':J' + categoryTotals['Прочее'] + ')');
  const vat = summary(estimateVatLabel(estimate.vatRate), totals.vat == null ? null : totals.vat / 100, totals.vat == null ? null :
    'ROUND((J' + categoryTotals['Работы'] + '+J' + categoryTotals['Механизмы'] + ')*' + Math.round(estimate.vatRate * 100) + '/10000,2)');
  const final = summary('ИТОГО с НДС', totals.total == null ? null : totals.total / 100,
    totals.total == null ? null : 'SUM(J' + subtotal + ',J' + vat + ')');
  const notes = [
    estimate.rows.some(source => source.customerPrice == null) ? 'Предварительная смета' : '',
    totals.missing ? 'Позиций без цены: ' + totals.missing : '',
    totals.vat == null ? 'Ставка НДС не указана' : ''
  ].filter(Boolean);
  if (notes.length) sectionHeading(notes.join(' · '), 115);

  const formulaInExcel = formula => {
    if (!formula?.startsWith('=')) return null;
    const expression = formula.slice(1).replace(/(?<=\d)[ \u00a0\u202f](?=\d{3}(?:\D|$))/g, '').replaceAll(',', '.');
    if (!/^[0-9@+*/().\s-]+$/.test(expression)) return null;
    const converted = expression.replace(/@(\d+)/g, (match, id) => worksheetRows.has(id) ? 'H' + worksheetRows.get(id) : '#REF!');
    return /[@#]/.test(converted) ? null : converted;
  };

  const fixedHeader = {
    G1: header.agreement,
    A5: '____________________________' + header.contractor,
    G4: estimate.client,
    G5: '_____________________________' + header.customer,
    A6: '"____" ______________________ ' + header.year + ' года',
    G6: '"____" __________________________ ' + header.year + ' года',
    A8: estimate.name,
    A11: 'СМЕТНЫЙ РАСЧЕТ № ' + estimate.id,
    A13: estimate.scope,
    E16: (totals.total ?? totals.subtotal) / 100000
  };
  const headerRows = template.header.map(([row, height, cells]) => rowXml(row, row === 8 || row === 13 ?
    Math.max(height, 18 * Math.ceil(String(fixedHeader['A' + row] ?? '').length / 125)) : height,
    cells.map(([col, style, value]) => {
      const ref = col + row;
      return cell(ref, ref === 'E16' ? template.numeric.thousands : style, Object.hasOwn(fixedHeader, ref) ? fixedHeader[ref] : value,
        ref === 'E16' ? 'J' + (totals.total == null ? subtotal : final) + '/1000' : null);
    }))).join('');
  const details = rows.map(record => {
    if (typeof record === 'string') return record;
    const { number, source, position } = record;
    const selectedPrice = estimateLinePrice(source);
    const amountCents = estimateLineAmount(source);
    const amount = amountCents == null ? null : amountCents / 100;
    merges.push('C' + number + ':E' + number);
    const rowCells = [
      ['A', 61, position],
      ['B', 31, 'Договорная цена'],
      ['C', 104, source.name],
      ['F', 30, source.unit],
      ['G', 33, null],
      ['H', template.numeric.volume, source.volume, source.volume == null ? null : formulaInExcel(source.formulas?.volume)],
      ['I', 34, selectedPrice.value, selectedPrice.value == null ? null :
        formulaInExcel(source.formulas?.[source.customerPrice != null ? 'customerPrice' : selectedPrice.field])],
      ['J', template.numeric.money, amount, amount == null ? null : 'ROUND(H' + number + '*I' + number + ',2)'],
      ...['K', 'L', 'M'].map(col => [col, 35, null])
    ];
    rowCells.push(['N', 0, estimateAmountCategory(source.category)]);
    return tableRow(number, Math.max(25.5, 15 * Math.ceil(source.name.length / 52)), rowCells, 'C', 'E');
  }).join('');

  const spreadsheetNs = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const packageNs = 'http://schemas.openxmlformats.org/package/2006';
  const documentNs = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const relationship = (id, type, target) =>
    '<Relationship Id="' + id + '" Type="' + documentNs + '/' + type + '" Target="' + target + '"/>';
  const relationships = (...entries) => '<Relationships xmlns="' + packageNs + '/relationships">' +
    entries.join('') + '</Relationships>';
  const sheet = '<worksheet xmlns="' + spreadsheetNs + '"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>' +
    '<dimension ref="A1:N' + number + '"/><sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews>' +
    '<sheetFormatPr defaultRowHeight="15"/><cols>' + template.widths.map((width, i) =>
      '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + width + '" customWidth="1"/>').join('') +
    '<col min="14" max="14" hidden="1" width="12" customWidth="1"/></cols><sheetData>' + headerRows + details + '</sheetData>' +
    '<mergeCells count="' + merges.length + '">' + merges.map(ref => '<mergeCell ref="' + ref + '"/>').join('') + '</mergeCells>' +
    '<printOptions horizontalCentered="1"/><pageMargins left="0.39" right="0.39" top="0.31" bottom="0.31" header="0.12" footer="0.12"/>' +
    '<pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>';
  const contentType = (part, type) => '<Override PartName="/xl/' + part +
    '" ContentType="application/vnd.openxmlformats-officedocument.' + type + '+xml"/>';
  return zipEstimateParts({
    '[Content_Types].xml': '<Types xmlns="' + packageNs + '/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      contentType('workbook.xml', 'spreadsheetml.sheet.main') + contentType('worksheets/sheet1.xml', 'spreadsheetml.worksheet') +
      contentType('styles.xml', 'spreadsheetml.styles') + contentType('theme/theme1.xml', 'theme') + '</Types>',
    '_rels/.rels': relationships(relationship('rId1', 'officeDocument', 'xl/workbook.xml')),
    'xl/workbook.xml': '<workbook xmlns="' + spreadsheetNs + '" xmlns:r="' + documentNs +
      '"><bookViews><workbookView/></bookViews><sheets><sheet name="Смета" sheetId="1" r:id="rId1"/></sheets>' +
      '<definedNames><definedName name="_xlnm.Print_Area" localSheetId="0">Смета!$A$1:$M$' + number +
      '</definedName><definedName name="_xlnm.Print_Titles" localSheetId="0">Смета!$18:$21</definedName></definedNames>' +
      '<calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>',
    'xl/_rels/workbook.xml.rels': relationships(relationship('rId1', 'worksheet', 'worksheets/sheet1.xml'),
      relationship('rId2', 'styles', 'styles.xml'), relationship('rId3', 'theme', 'theme/theme1.xml')),
    'xl/worksheets/sheet1.xml': sheet,
    'xl/styles.xml': template.styles,
    'xl/theme/theme1.xml': template.theme
  });
}

function zipEstimateParts(parts) {
  const encoder = new TextEncoder();
  const records = [];
  const directory = [];
  let offset = 0;
  let directorySize = 0;
  const crcTable = Uint32Array.from({ length: 256 }, (_, value) => {
    for (let bit = 0; bit < 8; bit++) value = (value >>> 1) ^ (value & 1 ? 0xedb88320 : 0);
    return value;
  });

  for (const [path, text] of Object.entries(parts)) {
    const name = encoder.encode(path);
    const bytes = encoder.encode(text);
    let crc = 0xffffffff;
    for (const byte of bytes) crc = (crc >>> 8) ^ crcTable[(crc ^ byte) & 0xff];
    crc ^= 0xffffffff;
    const local = new Uint8Array(30 + name.length);
    const l = new DataView(local.buffer);
    l.setUint32(0, 0x04034b50, true);
    l.setUint16(4, 20, true);
    l.setUint16(12, 33, true);
    l.setUint32(14, crc, true);
    l.setUint32(18, bytes.length, true);
    l.setUint32(22, bytes.length, true);
    l.setUint16(26, name.length, true);
    local.set(name, 30);
    const central = new Uint8Array(46 + name.length);
    const c = new DataView(central.buffer);
    c.setUint32(0, 0x02014b50, true);
    c.setUint16(4, 20, true);
    central.set(local.subarray(4, 30), 6);
    c.setUint32(42, offset, true);
    central.set(name, 46);
    records.push(local, bytes);
    directory.push(central);
    offset += local.length + bytes.length;
    directorySize += central.length;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, directory.length, true);
  end.setUint16(10, directory.length, true);
  end.setUint32(12, directorySize, true);
  end.setUint32(16, offset, true);
  return new Blob([...records, ...directory, end.buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

document.querySelector('#close-estimate-export').onclick = () => exportDialog.close();
exportForm.onsubmit = event => {
  event.preventDefault();
  const estimate = activeEstimate;
  if (!estimate) return;
  const fields = new FormData(exportForm);
  const header = Object.fromEntries(['agreement', 'contractor', 'customer'].map(key => [key, fields.get(key).trim()]));
  const year = estimate.date?.match(/\b20\d{2}\b/)?.[0] ?? new Date().getFullYear();
  try {
    const blob = createEstimateWorkbook(estimate, { ...header, year });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'Смета № ' + estimate.id.replace(/[^0-9A-Za-zА-Яа-я-]/g, '_') + '.xlsx';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    estimate.exportHeader = header;
    save();
    exportDialog.close();
    notify('Файл Excel выгружен.');
  } catch {
    document.querySelector('#estimate-export-status').textContent = 'Не удалось сформировать файл Excel. Попробуйте выгрузить смету ещё раз.';
  }
};

window.addEventListener('hashchange', () => renderScreen(true));
renderScreen();
</script>
