<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Русич · Сметы</title>
<style>
:root{color-scheme:light;--ink:#202c28;--muted:#596760;--line:#e0e7e2;--paper:#fff;--canvas:#f5f7f5;--green:#275b45;--green-dark:#194633;--soft:#e8f0e9;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--canvas)}
*{box-sizing:border-box}body{margin:0;font-size:16px}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #478468;outline-offset:3px}a{color:var(--green-dark)}.layout{min-height:100vh;display:grid;grid-template-columns:218px minmax(0,1fr)}
aside{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:27px 17px 20px;gap:34px}.brand{display:flex;gap:11px;align-items:center;padding:0 6px}.mark{width:39px;height:39px;display:grid;place-items:center;border-radius:10px;background:var(--green);color:white;font-size:22px;font-weight:800}.brand strong{display:block;font-size:19px;letter-spacing:.02em}.brand small,.side-note{font-size:13px;color:var(--muted)}.nav{display:block;background:var(--soft);border-radius:8px;padding:12px;color:var(--green-dark);text-decoration:none;font-weight:650;font-size:15px}.nav span{margin-right:9px}.side-note{margin-top:auto;padding:13px 6px 0;border-top:1px solid var(--line);line-height:1.5}
.top{height:66px;background:#fff;border-bottom:1px solid var(--line);padding:0 34px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:14px;color:var(--muted)}.crumb{display:flex;align-items:center;gap:10px}.crumb a{text-decoration:none}.demo{background:#edf3ee;border:1px solid #dce9de;color:var(--green-dark);padding:6px 10px;border-radius:20px;white-space:nowrap}
main{max-width:1530px;margin:auto;padding:33px 34px 44px}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.095em;font-weight:750;color:var(--green);margin:0 0 9px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(30px,4vw,42px);letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}h2{font-size:22px;letter-spacing:-.015em;margin-bottom:4px}.subtitle{color:var(--muted);line-height:1.5;margin-bottom:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:23px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.stat{padding:15px 17px;display:flex;flex-direction:column;gap:6px}.stat span{font-size:14px;color:var(--muted)}.stat strong{font-size:27px;letter-spacing:-.03em}.stat:first-child{border-color:#d1e3d5;background:#eef5ef}.panel-head{padding:20px 19px 0}.toolbar{padding:16px 19px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.search{flex:1 1 220px;max-width:410px}input,select{min-height:41px;border:1px solid #cdd8d0;border-radius:7px;background:#fff;color:var(--ink);padding:8px 11px;width:100%}input::placeholder{color:#65746b}select{width:auto;max-width:100%;appearance:none;padding-right:33px;background-image:linear-gradient(45deg,transparent 50%,#52635a 50%),linear-gradient(135deg,#52635a 50%,transparent 50%);background-position:calc(100% - 15px) 17px,calc(100% - 10px) 17px;background-size:5px 5px;background-repeat:no-repeat}
.btn{min-height:40px;border:1px solid #cdd8d0;border-radius:8px;padding:9px 13px;background:#fff;color:var(--ink);font-size:14px;font-weight:650}.btn:hover{background:#edf3ee}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:var(--green-dark)}.text-btn{border:0;background:transparent;color:var(--green-dark);padding:0;text-align:left;font-weight:700;line-height:1.4}.text-btn:hover{text-decoration:underline}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px;text-align:left;font-size:14px}th,td{padding:12px 13px;border-bottom:1px solid #e8ede9;vertical-align:middle;line-height:1.4}th:first-child,td:first-child{padding-left:19px}th:last-child,td:last-child{padding-right:19px}th{background:#f1f5f2;color:#47574f;font-weight:650;white-space:nowrap}tbody tr:hover{background:#f6faf7}.secondary{display:block;color:var(--muted);font-size:13px;margin-top:3px}.num{white-space:nowrap;font-variant-numeric:tabular-nums}.pill{display:inline-block;padding:4px 8px;border-radius:6px;font-size:13px;font-weight:650;line-height:1.35;background:#edf0ee;color:#45544d}.pill.work{background:#e6eef9;color:#284d74}.pill.wait{background:#fbefdb;color:#734d13}.pill.done{background:#e1f0e5;color:#21573d}.foot{padding:12px 19px;color:var(--muted);font-size:14px}.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:12px 19px 0;border-bottom:1px solid var(--line)}.tab{padding:10px 9px;border:0;border-radius:6px 6px 0 0;border-bottom:3px solid transparent;background:white;color:#53645a;font-size:14px;font-weight:600}.tab[aria-pressed=true]{color:var(--green-dark);border-color:var(--green);background:#f0f5f1}.tab:hover{background:#f0f5f1}.tab small{font-size:12px;margin-left:4px}.empty{text-align:center;padding:28px;color:var(--muted)}.note{font-size:14px;color:var(--muted);margin:0;line-height:1.5}.compact{white-space:nowrap}.stack{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stats .note{font-size:13px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
dialog{border:0;border-left:1px solid var(--line);width:min(500px,100vw);height:100%;max-height:100%;max-width:100%;margin:0 0 0 auto;padding:0;background:#fff;color:var(--ink);box-shadow:-12px 0 40px #182a2326}dialog::backdrop{background:#1c2b2459}.drawer{display:flex;min-height:100%;flex-direction:column}.drawer-head{padding:22px 24px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.drawer-head h2{font-size:25px}.drawer-body{padding:18px 24px 24px}.route{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:4px}.route li{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:7px;color:#52615a;font-size:14px}.route li[aria-current=step]{background:var(--soft);color:var(--green-dark);font-weight:700}.step-icon{border:1px solid #c7d8cb;width:25px;height:25px;display:grid;place-items:center;border-radius:50%;flex:none;font-size:13px}.route-status{margin-left:auto;font-size:12px}.detail{margin:0 0 18px;display:grid;grid-template-columns:1fr 1fr;gap:11px;background:var(--canvas);padding:13px;border:1px solid var(--line);border-radius:8px}.detail dt{font-size:13px;color:var(--muted);margin-bottom:3px}.detail dd{margin:0;font-size:14px;font-weight:650}.action{border-top:1px solid var(--line);padding-top:17px}.action h3{font-size:17px;margin-bottom:6px}.fields{display:grid;gap:12px;margin-top:12px}.fields label{display:grid;gap:5px;font-size:14px;font-weight:650}.fields select{width:100%}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action .btn{margin-top:14px;width:100%}.toast{position:fixed;z-index:5;bottom:18px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);background:var(--green-dark);color:#fff;border-radius:8px;padding:12px 16px;font-size:14px;margin:0}.toast:empty{display:none}
@media(max-width:1050px){.layout{grid-template-columns:173px minmax(0,1fr)}main,.top{padding-left:22px;padding-right:22px}}@media(max-width:720px){.layout{display:block}aside{display:none}.top{height:auto;min-height:52px;padding:10px 14px}main{padding:22px 12px 32px}.heading{align-items:flex-start;flex-direction:column;gap:12px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:22px}.stat span{font-size:13px}.toolbar,.panel-head,.tabs{padding-left:12px;padding-right:12px}}
.positions-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.drawer-head{flex-wrap:wrap}
.handoff{margin:0 0 12px;padding:9px 11px;border-radius:7px;background:var(--soft);color:var(--green-dark);font-size:14px;line-height:1.4}
.action .copy-price{width:auto;justify-self:start;margin-top:0}
</style>
</head>
<body>
<div class="layout">
  <aside aria-label="Навигация">
    <div class="brand"><div class="mark" aria-hidden="true">Р</div><div><strong>Русич</strong><small>ООО «ИСК Русич»</small></div></div>
    <a class="nav" href="#estimates"><span aria-hidden="true">▤</span>Сметы</a>
    <div class="side-note">Учебные данные<br>Внутренняя система смет</div>
  </aside>
  <div>
    <header class="top"><nav class="crumb" id="crumb" aria-label="Вы здесь"></nav><span class="demo">Демо-режим</span></header>
    <main id="main"></main>
  </div>
</div>
<dialog id="position" aria-labelledby="drawer-title"></dialog>
<p id="toast" class="toast" role="status"></p>
<script>
'use strict';

const categories = ['Работы', 'Материалы', 'Механизмы', 'Доставка'];
const steps = [
  { role: 'ПТО', missing: 'Позиция и объём', action: 'Передать главному инженеру' },
  { role: 'Главный инженер', missing: 'Часы механизма', action: 'Передать в ОМТС' },
  { role: 'ОМТС', missing: 'Цена от ОМТС', action: 'Передать коммерческому директору' },
  { role: 'Коммерческий директор', missing: 'Подтверждение цены для заказчика', action: 'Подтвердить цену для заказчика' }
];
const makeRow = (id, name, category, unit, volume, hours, supplyPrice, customerPrice) =>
  ({ id, name, category, unit, volume, hours, supplyPrice, customerPrice });
const seed = [
  { id: '26-014', name: 'Складской комплекс «Северный»', client: 'ООО «Север Логистика»', scope: 'Земляные работы и основания', date: '24.11.2026', rows: [
    makeRow('1', 'Разработка грунта', 'Работы', 'м³', 180, null, 460, 620),
    makeRow('2', 'Устройство щебёночного основания', 'Работы', 'м²', 240, null, 510, null),
    makeRow('3', 'Щебень фракции 20–40', 'Материалы', 'м³', 48, null, null, null),
    makeRow('4', 'Геотекстиль 300 г/м²', 'Материалы', 'м²', 265, null, 140, 180),
    makeRow('5', 'Экскаватор гусеничный', 'Механизмы', 'смена', 2, null, null, null),
    makeRow('6', 'Каток грунтовый', 'Механизмы', 'смена', 1, 8, null, null),
    makeRow('7', 'Доставка щебня самосвалом', 'Доставка', 'рейс', 6, null, 4100, null),
    makeRow('8', 'Перевозка грунта', 'Доставка', 'рейс', 4, null, 3500, 4700)
  ] },
  { id: '26-011', name: 'Производственный корпус «Восток»', client: 'АО «Восток Пром»', scope: 'Подготовка строительной площадки', date: '20.11.2026', rows: [
    makeRow('1', 'Подготовка площадки', 'Работы', 'м²', 300, null, null, null),
    makeRow('2', 'Песок строительный', 'Материалы', 'м³', 20, null, 880, null),
    makeRow('3', 'Фронтальный погрузчик', 'Механизмы', 'смена', 1, null, null, null),
    makeRow('4', 'Доставка песка', 'Доставка', 'рейс', 2, null, 3200, 3900)
  ] },
  { id: '26-008', name: 'Подъездная дорога к парку «Лесной»', client: 'ООО «Лесной Парк»', scope: 'Устройство временного проезда', date: '17.11.2026', rows: [
    makeRow('1', 'Профилирование проезда', 'Работы', 'м²', 150, null, 320, 420),
    makeRow('2', 'Щебёночно-песчаная смесь', 'Материалы', 'т', 25, null, 1100, 1450),
    makeRow('3', 'Автогрейдер', 'Механизмы', 'смена', 1, 6, 17500, 21000),
    makeRow('4', 'Доставка смеси', 'Доставка', 'рейс', 3, null, 4000, 5100)
  ] }
];
const storageKey = 'rusich-estimates-demo-v1';
let estimates;
try {
  estimates = JSON.parse(localStorage.getItem(storageKey)) || structuredClone(seed);
} catch {
  estimates = structuredClone(seed);
}
const main = document.querySelector('#main');
const crumb = document.querySelector('#crumb');
const dialog = document.querySelector('#position');
const toast = document.querySelector('#toast');
const listFilters = { query: '', status: 'all' };
let cardFilters = { query: '', category: 'all', role: 'all' };
let activeEstimate;
let drawerReturn;
let toastTimer;
const numbers = new Intl.NumberFormat('ru-RU');
const esc = value => String(value ?? '').replace(/[&<>"']/g, char =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
const quantity = value => value == null ? '—' : numbers.format(value);
const money = value => value == null ? '—' : numbers.format(value) + ' ₽';
const estimateStatus = estimate => estimate.rows.every(row => nextStep(row) === 4) ? 'Готова' : 'В работе';
const rowMatches = (row, query) => row.name.toLocaleLowerCase('ru').includes(query.trim().toLocaleLowerCase('ru'));

function nextStep(row) {
  if (!row.name || row.volume == null) return 0;
  if (row.category === 'Механизмы' && row.hours == null) return 1;
  if (row.supplyPrice == null) return 2;
  if (row.customerPrice == null) return 3;
  return 4;
}

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(estimates));
    return true;
  } catch {
    return false;
  }
}

function notify(message) {
  clearTimeout(toastTimer);
  toast.textContent = message;
  toastTimer = setTimeout(() => { toast.textContent = ''; }, 4500);
}

function stat(label, value, detail = '') {
  return '<div class="stat"><span>' + label + '</span><strong>' + value +
    '</strong>' + (detail ? '<p class="note">' + detail + '</p>' : '') + '</div>';
}

function searchField(value, placeholder) {
  return '<label class="search"><span class="sr-only">' + placeholder +
    '</span><input type="search" id="query" placeholder="' + placeholder + '" value="' + esc(value) + '"></label>';
}

function filterSelect(id, label, first, values, selected) {
  return '<select id="' + id + '" aria-label="' + label + '"><option value="all">' + first + '</option>' +
    values.map(value => '<option' + (selected === value ? ' selected' : '') + '>' + esc(value) + '</option>').join('') + '</select>';
}

function table(headers, rows) {
  return '<div class="table-wrap"><table><thead><tr>' +
    headers.map(header => '<th scope="col">' + header + '</th>').join('') +
    '</tr></thead><tbody>' + (rows.join('') || '<tr><td class="empty" colspan="' + headers.length + '">По этим фильтрам ничего не найдено.</td></tr>') +
    '</tbody></table></div>';
}

function renderList() {
  const completed = estimates.filter(estimate => estimateStatus(estimate) === 'Готова').length;
  crumb.innerHTML = '<span aria-current="page">Сметы</span>';
  main.innerHTML = '<div class="heading"><div><p class="eyebrow">Сметный отдел</p><h1>Сметы</h1>' +
    '<p class="subtitle">Откройте смету, чтобы увидеть позиции и передать их дальше.</p></div></div>' +
    '<section class="stats" aria-label="Состояние смет">' + stat('Всего смет', estimates.length) +
    stat('В работе', estimates.length - completed) + stat('Готовы', completed) + '</section>' +
    '<section class="panel" aria-labelledby="list-title"><div class="panel-head"><h2 id="list-title">Реестр смет</h2></div>' +
    '<div class="toolbar">' + searchField(listFilters.query, 'Поиск по номеру, объекту или заказчику') +
    filterSelect('status', 'Статус сметы', 'Все статусы', ['В работе', 'Готова'], listFilters.status) +
    '<button class="btn" id="clear" type="button">Сбросить фильтры</button></div><div id="results"></div></section>';
  const draw = () => {
    const query = listFilters.query.trim().toLocaleLowerCase('ru');
    const visible = estimates.filter(estimate =>
      [estimate.id, estimate.name, estimate.client].some(value => value.toLocaleLowerCase('ru').includes(query)) &&
      (listFilters.status === 'all' || listFilters.status === estimateStatus(estimate)));
    const rows = visible.map(estimate => {
      const ready = estimate.rows.filter(row => nextStep(row) === 4).length;
      const status = estimateStatus(estimate);
      return '<tr><td class="num">№ ' + estimate.id + '</td><td><a class="text-btn" href="#estimate/' + estimate.id + '">' +
        esc(estimate.name) + '</a><span class="secondary">' + esc(estimate.scope) + '</span></td><td>' + esc(estimate.client) +
        '</td><td><span class="pill ' + (status === 'Готова' ? 'done' : 'work') + '">' + status + '</span></td>' +
        '<td class="num">' + ready + ' из ' + estimate.rows.length + '</td><td class="num">' + estimate.date + '</td></tr>';
    });
    document.querySelector('#results').innerHTML = table(['Номер', 'Объект', 'Заказчик', 'Статус', 'Готовые позиции', 'Дата сметы'], rows) +
      '<div class="foot" role="status">Показано ' + visible.length + ' из ' + estimates.length + '</div>';
  };
  document.querySelector('#query').oninput = event => { listFilters.query = event.target.value; draw(); };
  document.querySelector('#status').onchange = event => { listFilters.status = event.target.value; draw(); };
  document.querySelector('#clear').onclick = () => { Object.assign(listFilters, { query: '', status: 'all' }); renderList(); document.querySelector('#query').focus(); };
  draw();
}

function renderCard() {
  const estimate = activeEstimate;
  const ready = estimate.rows.filter(row => nextStep(row) === 4);
  const approvedTotal = ready.reduce((total, row) => total + row.volume * row.customerPrice, 0);
  crumb.innerHTML = '<a href="#estimates">Сметы</a><span aria-hidden="true">/</span><span aria-current="page">№ ' + estimate.id + '</span>';
  main.innerHTML = '<div class="heading"><div><p class="eyebrow">Смета № ' + estimate.id + '</p><h1>' + esc(estimate.name) +
    '</h1><p class="subtitle">' + esc(estimate.scope) + ' · ' + esc(estimate.client) + '</p></div></div>' +
    '<section class="stats" aria-label="Сводка по позициям">' + stat('Подтверждено позиций', ready.length + ' из ' + estimate.rows.length) +
    stat('Требуют действия', estimate.rows.length - ready.length) + stat('Подтверждено для заказчика', money(approvedTotal), 'По согласованным позициям') + '</section>' +
    '<section class="panel" aria-labelledby="card-title"><div class="panel-head positions-head"><div><h2 id="card-title">Позиции сметы</h2>' +
    '<p class="note">Нажмите на название позиции, чтобы увидеть маршрут и выполнить следующий шаг.</p></div>' +
    '<button class="btn primary compact" id="add" type="button">+ Добавить позицию</button></div>' +
    '<div class="tabs" role="group" aria-label="Раздел сметы" id="categories"></div><div class="toolbar">' +
    searchField(cardFilters.query, 'Поиск по названию позиции') +
    filterSelect('role', 'Ответственный за следующий шаг', 'Все ответственные', [...steps.map(step => step.role), 'Готово'], cardFilters.role) +
    '<button class="btn" id="clear" type="button">Сбросить фильтры</button></div><div id="results"></div></section>';
  const draw = () => {
    const tabs = document.querySelector('#categories');
    tabs.innerHTML = [['all', 'Все позиции'], ...categories.map(category => [category, category])].map(([value, label]) => {
      const count = value === 'all' ? estimate.rows.length : estimate.rows.filter(row => row.category === value).length;
      return '<button type="button" class="tab" data-category="' + value + '" aria-pressed="' +
        (cardFilters.category === value) + '">' + label + ' <small>' + count + '</small></button>';
    }).join('');
    const visible = estimate.rows.filter(row => {
      const step = steps[nextStep(row)];
      return (cardFilters.category === 'all' || cardFilters.category === row.category) &&
        (cardFilters.role === 'all' || cardFilters.role === (step ? step.role : 'Готово')) && rowMatches(row, cardFilters.query);
    });
    const rows = visible.map(row => {
      const step = steps[nextStep(row)];
      return '<tr><td><button class="text-btn" data-row="' + esc(row.id) + '" type="button">' + esc(row.name) +
        '</button><span class="secondary">' + esc(row.category) + '</span></td><td class="num">' + quantity(row.volume) + ' ' + esc(row.unit) +
        '</td><td class="num">' + quantity(row.hours) + '</td><td class="num">' + money(row.supplyPrice) + '</td><td class="num">' +
        money(row.customerPrice) + '</td><td><span class="pill ' + (step ? 'wait' : 'done') + '">' + (step ? step.missing : 'Готово') +
        '</span></td><td>' + (step ? step.role : '—') + '</td></tr>';
    });
    document.querySelector('#results').innerHTML = table(['Позиция', 'Объём', 'Часы, ч', 'Цена ОМТС / ед.', 'Цена заказчику / ед.', 'Чего не хватает', 'Следующий ответственный'], rows) +
      '<div class="foot" role="status">Показано ' + visible.length + ' из ' + estimate.rows.length + '</div>';
  };
  document.querySelector('#categories').onclick = event => {
    const button = event.target.closest('[data-category]');
    if (!button) return;
    cardFilters.category = button.dataset.category;
    draw();
    [...document.querySelectorAll('[data-category]')].find(tab => tab.dataset.category === cardFilters.category).focus();
  };
  document.querySelector('#query').oninput = event => { cardFilters.query = event.target.value; draw(); };
  document.querySelector('#role').onchange = event => { cardFilters.role = event.target.value; draw(); };
  document.querySelector('#clear').onclick = () => { cardFilters = { query: '', category: 'all', role: 'all' }; renderCard(); document.querySelector('#query').focus(); };
  document.querySelector('#results').onclick = event => {
    const button = event.target.closest('[data-row]');
    if (button) openDrawer(estimate.rows.find(row => row.id === button.dataset.row));
  };
  document.querySelector('#add').onclick = () => openDrawer(null);
  draw();
}

function stepForm(index) {
  if (index === 4) return '<div class="action"><h3>Позиция готова</h3><p class="note">Цена для заказчика подтверждена.</p></div>';
  const descriptions = [
    'Укажите название, раздел, единицу измерения и объём. Для механизмов следующим шагом будет ввод часов. Остальные позиции сразу попадут в ОМТС.',
    'Укажите общее количество часов работы механизма по этой позиции.',
    'Укажите условную цену ОМТС за единицу позиции.',
    'Укажите и подтвердите условную цену для заказчика за единицу позиции.'
  ];
  const numericField = (label, name) =>
    '<label>' + label + '<input name="' + name + '" type="number" min="0.01" max="100000000" step="0.01" required></label>';
  const fields = [
    () => '<label>Название позиции<input name="name" required maxlength="120" placeholder="Например, мини-экскаватор"></label>' +
      '<label>Раздел<select name="category" required><option value="">Выберите раздел</option>' +
      categories.map(category => '<option' + (cardFilters.category === category ? ' selected' : '') + '>' + category + '</option>').join('') +
      '</select></label><div class="pair"><label>Единица измерения<select name="unit" required>' +
      ['м³', 'м²', 'т', 'шт.', 'смена', 'ч', 'рейс', 'компл.'].map(unit => '<option>' + unit + '</option>').join('') +
      '</select></label>' + numericField('Объём', 'volume') + '</div>',
    () => numericField('Часы работы, ч', 'hours'),
    () => numericField('Цена ОМТС за единицу, ₽', 'supplyPrice'),
    () => numericField('Цена заказчику за единицу, ₽', 'customerPrice') +
      '<button class="btn copy-price" id="copy-price" type="button">Взять цену ОМТС</button>'
  ];
  return '<form class="action" id="step-form"><h3>Действие · ' + steps[index].role + '</h3><p class="note">' + descriptions[index] +
    '</p><div class="fields">' + fields[index]() + '</div><button class="btn primary" type="submit">' + steps[index].action + '</button></form>';
}

function renderDrawer(row, status = '') {
  const index = row ? nextStep(row) : 0;
  const number = index === 0 ? 'Новая позиция' : 'Позиция сметы № ' + activeEstimate.id;
  const values = row ? [
    ['Раздел', row.category], ['Объём', quantity(row.volume) + ' ' + row.unit],
    ...(row.category === 'Механизмы' ? [['Часы механизма', row.hours == null ? '—' : quantity(row.hours) + ' ч']] : []),
    ['Цена ОМТС / ед.', money(row.supplyPrice)], ['Цена заказчику / ед.', money(row.customerPrice)]
  ] : [];
  const route = steps.map((step, position) => {
    const skipped = index > 0 && position === 1 && row.category !== 'Механизмы';
    return '<li' + (position === index ? ' aria-current="step"' : '') + '><span class="step-icon" aria-hidden="true">' +
      (skipped ? '–' : position < index ? '✓' : position + 1) + '</span><span>' + step.role + '</span><span class="route-status">' +
      (skipped ? 'Не требуется' : position === index ? 'Сейчас' : position < index ? 'Выполнено' : 'Ожидает') + '</span></li>';
  }).join('');

  dialog.innerHTML = '<div class="drawer"><header class="drawer-head"><div><p class="eyebrow">' + number + '</p>' +
    '<h2 id="drawer-title" tabindex="-1">' + esc(row ? row.name : 'Добавить позицию') + '</h2></div><button class="btn compact" ' +
    'id="close-drawer" type="button">К позициям сметы</button></header>' +
    '<div class="drawer-body"><ol class="route" aria-label="Маршрут позиции">' + route + '</ol>' +
    (values.length ? '<dl class="detail">' + values.map(([label, value]) =>
      '<div><dt>' + label + '</dt><dd>' + esc(value) + '</dd></div>').join('') + '</dl>' : '') +
    (status ? '<p class="handoff" id="drawer-status" role="status">' + esc(status) + '</p>' : '') +
    stepForm(index) + '</div></div>';
  dialog.querySelector('#close-drawer').onclick = () => dialog.close();
  const form = dialog.querySelector('#step-form');
  if (!form) return;
  if (index === 3) {
    dialog.querySelector('#copy-price').onclick = () => {
      const field = form.elements.namedItem('customerPrice');
      field.value = row.supplyPrice;
      field.focus();
    };
  }
  const categorySelect = form.elements.namedItem('category');
  if (categorySelect) {
    const defaultUnits = ['м²', 'м³', 'смена', 'рейс'];
    const setUnit = () => {
      const selection = categories.indexOf(categorySelect.value);
      if (selection >= 0) form.elements.namedItem('unit').value = defaultUnits[selection];
      form.querySelector('button[type="submit"]').textContent =
        selection < 0 || selection === 2 ? steps[0].action : 'Передать в ОМТС';
    };
    categorySelect.onchange = setUnit;
    setUnit();
    form.elements.namedItem('name').oninput = event => event.target.setCustomValidity('');
  }
  form.onsubmit = event => {
    event.preventDefault();
    const fields = new FormData(form);
    if (index === 0) {
      const name = fields.get('name').trim();
      if (!name) {
        const input = form.elements.namedItem('name');
        input.setCustomValidity('Введите название позиции.');
        input.reportValidity();
        return;
      }
      row = makeRow(String(activeEstimate.rows.length + 1), name, fields.get('category'), fields.get('unit'),
        Number(fields.get('volume')), null, null, null);
      activeEstimate.rows.push(row);
      cardFilters = { query: '', category: row.category, role: 'all' };
    } else {
      const key = ['volume', 'hours', 'supplyPrice', 'customerPrice'][index];
      row[key] = Number(fields.get(key));
      if (cardFilters.role !== 'all') cardFilters.role = 'all';
    }
    drawerReturn = row.id;
    const saved = save();
    renderCard();
    const status = [
      '', 'Позиция передана главному инженеру.', 'Позиция передана в ОМТС.',
      'Позиция передана коммерческому директору.', 'Цена для заказчика подтверждена.'
    ][nextStep(row)];
    const message = saved ? status : status + ' Изменения сохранены до закрытия страницы.';
    renderDrawer(row, message);
    const nextField = dialog.querySelector('#step-form input');
    const focusTarget = nextField || dialog.querySelector('#drawer-title');
    focusTarget.setAttribute('aria-describedby', 'drawer-status');
    focusTarget.focus();
    notify(message);
  };
}

function openDrawer(row) {
  drawerReturn = row?.id;
  renderDrawer(row);
  dialog.showModal();
  dialog.querySelector('#drawer-title').focus();
}

dialog.addEventListener('close', () => {
  if (!activeEstimate) return;
  const rowButton = [...main.querySelectorAll('[data-row]')].find(button => button.dataset.row === drawerReturn);
  (rowButton || document.querySelector('#add'))?.focus();
});

function renderScreen(focusHeading = false) {
  const match = location.hash.match(/^#estimate\/(.+)$/);
  const estimate = match ? estimates.find(item => item.id === match[1]) : null;
  if (dialog.open) dialog.close();
  if (estimate !== activeEstimate) cardFilters = { query: '', category: 'all', role: 'all' };
  activeEstimate = estimate;
  if (estimate) renderCard();
  else renderList();
  document.title = estimate ? 'Смета № ' + estimate.id + ' · Русич' : 'Сметы · Русич';
  if (focusHeading) {
    const heading = main.querySelector('h1');
    heading.tabIndex = -1;
    heading.focus();
    window.scrollTo(0, 0);
  }
}
window.addEventListener('hashchange', () => renderScreen(true));
renderScreen();
</script>
</body>
</html>
